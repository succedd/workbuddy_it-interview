# it-interview · Cloudflare Zone 安全基线
# ============================================================
# 为什么在 CI 里跑、而不是本机跑：
#   本机 wrangler 的 OAuth 只有 zone:read（读 zone settings 报 9109，写更不行）。
#   本意是让 CI 拿着仓库 Secret `CLOUDFLARE_API_TOKEN` 当「凭据代理」执行，
#   本机永远不用持有高权限 token —— 但 2026-09-22 实测该 Secret **同样缺
#   Zone Settings 权限**（它实际只有 `Account.Cloudflare Pages`），CI 里也报 9109。
#   ⇒ 本流水线目前是「休眠」状态，一次都没跑成功过。**要让它生效，先给该 token
#     补上「Zone → Zone Settings → Edit」（Zone Resources: Include → Specific zone
#     → itinterview.com.cn），再 push 到 cf-zone-setup 分支。**
#
# 【要不要为它动 token？实测结论：不值得】见 tools/ci/zone-security.py 文件头：
#   最低 TLS 已达成（服务端主动拒绝 TLS1.0/1.1）、TLS1.3 已开、强制 HTTPS 与 HSTS
#   已在应用层（_worker.js）生效、机会加密的实际影响已被 301 覆盖。
#   只有「想留档」或「想彻底关掉机会加密」时才有必要补这条权限。
#
# 【触发方式】
#   把本文件推到名为 cf-zone-setup 的分支即自动执行一次（幂等，重推重跑）。
#   也可以推到默认分支后用 workflow_dispatch 手动触发。
#
# 【它做什么】
#   1) 只读打印当前 zone 设置（含安全级别与 Bot Fight Mode 现状，便于留档）
#   2) 应用传输层安全基线：Always Use HTTPS / 最低 TLS 1.2 / TLS 1.3
#                          / 关闭「随机加密」（否则百度爬虫抓取失败）
#                          / HSTS（180 天 + includeSubDomains，不开 preload）
#   3) 复查逐项打 PASS/FAIL，有 FAIL 即 exit 1
#
# 【刻意不做的两件事】Security Level=High、Bot Fight Mode —— 理由写在
#   tools/ci/zone-security.py 的文件头，核心是会误伤国内真实访客与百度爬虫。
# ============================================================

name: CF Zone Security Baseline

on:
  push:
    branches: [cf-zone-setup]
  workflow_dispatch:

jobs:
  zone-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Zone settings — before
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 tools/ci/zone-security.py

      - name: Apply transport security baseline
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 tools/ci/zone-security.py --apply
