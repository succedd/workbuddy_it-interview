<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1080" height="520" fill="#ffffff"/>
  <text x="20" y="38" font-size="22" font-weight="700" fill="#0f172a">百舸整机调度：为什么"有空闲卡"任务还 Pending</text>
  <text x="20" y="62" font-size="14" fill="#64748b">调度按单节点判断：GPU、CPU、内存必须在同一台节点上同时满足，不能跨节点拼凑</text>

  <rect x="20" y="84" width="1040" height="34" rx="4" fill="#f1f5f9"/>
  <text x="40" y="106" font-size="14" font-weight="700" fill="#334155">节点（最大可分配 170 核 / 898 GiB / 8 卡）</text>
  <text x="430" y="106" font-size="14" font-weight="700" fill="#334155">空闲 GPU</text>
  <text x="560" y="106" font-size="14" font-weight="700" fill="#334155">CPU 剩余 = 170 - 已分配</text>
  <text x="820" y="106" font-size="14" font-weight="700" fill="#334155">能否放下 80 核任务</text>

  <g font-size="14" fill="#0f172a">
    <text x="40" y="150">节点A</text><text x="430" y="150" fill="#16a34a" font-weight="700">2 张</text><text x="560" y="150">170 - 144 = 26 核</text><text x="820" y="150" fill="#dc2626" font-weight="700">26 &lt; 80，不满足</text>
    <text x="40" y="186">节点B</text><text x="430" y="186" fill="#16a34a" font-weight="700">2 张</text><text x="560" y="186">170 - 164 = 6 核</text><text x="820" y="186" fill="#dc2626" font-weight="700">6 &lt; 80，不满足</text>
    <text x="40" y="222">节点C</text><text x="430" y="222" fill="#94a3b8">0 张</text><text x="560" y="222">170 - 160 = 10 核</text><text x="820" y="222" fill="#94a3b8">无空闲卡</text>
    <text x="40" y="258">节点D</text><text x="430" y="258" fill="#94a3b8">0 张</text><text x="560" y="258">170 - 144 = 26 核</text><text x="820" y="258" fill="#94a3b8">无空闲卡</text>
  </g>
  <line x1="20" y1="164" x2="1060" y2="164" stroke="#e2e8f0"/>
  <line x1="20" y1="200" x2="1060" y2="200" stroke="#e2e8f0"/>
  <line x1="20" y1="236" x2="1060" y2="236" stroke="#e2e8f0"/>
  <line x1="20" y1="272" x2="1060" y2="272" stroke="#e2e8f0"/>
  <text x="40" y="298" font-size="13" fill="#64748b">界面"空闲量"是多节点累加值：合计 4 张空闲卡，但分散在两台节点，且没有任何一台的 CPU 剩余够用</text>

  <rect x="20" y="320" width="1040" height="70" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="540" y="350" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">单节点（最大可分配量 - 当前分配量）≥ 任务申请量  →  才能在该节点调度</text>
  <text x="540" y="376" font-size="13" fill="#1e40af" text-anchor="middle">CPU、内存、GPU 三项逐一比较，任意一项不满足，这台节点就被跳过</text>

  <g font-size="14" fill="#0f172a" text-anchor="middle">
    <rect x="20" y="420" width="190" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
    <text x="115" y="444" font-weight="700">提交任务</text><text x="115" y="464" font-size="12" fill="#475569">申请 CPU + 内存 + GPU</text>
    <rect x="260" y="420" width="210" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
    <text x="365" y="444" font-weight="700">调度器逐节点扫描</text><text x="365" y="464" font-size="12" fill="#475569">只看任务所在队列的节点</text>
    <rect x="520" y="404" width="260" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="650" y="429" fill="#166534">找到满足的节点 → 创建容器启动</text>
    <rect x="520" y="454" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="650" y="479" fill="#991b1b">一台都不满足 → 任务 Pending</text>
    <rect x="830" y="454" width="230" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="945" y="479" fill="#9a3412">调小 requests 后重新调度</text>
  </g>
  <line x1="210" y1="448" x2="256" y2="448" stroke="#334155" stroke-width="1.5" marker-end="url(#k)"/>
  <line x1="470" y1="440" x2="516" y2="426" stroke="#334155" stroke-width="1.5" marker-end="url(#k)"/>
  <line x1="470" y1="456" x2="516" y2="472" stroke="#334155" stroke-width="1.5" marker-end="url(#k)"/>
  <line x1="780" y1="474" x2="826" y2="474" stroke="#334155" stroke-width="1.5" marker-end="url(#k)"/>
</svg>
