<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="980" height="470" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">客户实际网络链路：四段串联</text>
  <text x="30" y="64" font-size="15" fill="#64748b">苏州办公网 → 苏州火山云 → 苏州百度云 → 北京百度云，经过两种不同的互联方式</text>
  <rect x="20" y="110" width="160" height="120" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="48" y="146" font-size="17" font-weight="700" fill="#9a3412">苏州办公网</text>
  <text x="40" y="174" font-size="13" fill="#9a3412">办公网段 /24</text>
  <text x="40" y="196" font-size="13" fill="#9a3412">经核心交换机</text>
  <text x="40" y="216" font-size="13" fill="#9a3412">专线接入火山</text>
  <rect x="250" y="110" width="160" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="285" y="146" font-size="17" font-weight="700" fill="#991b1b">苏州火山云</text>
  <text x="270" y="174" font-size="13" fill="#991b1b">多云互联中心</text>
  <text x="270" y="196" font-size="13" fill="#991b1b">学到百度侧大网段</text>
  <text x="270" y="216" font-size="13" fill="#991b1b">10.x.0.0/16</text>
  <rect x="480" y="110" width="180" height="120" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="502" y="146" font-size="17" font-weight="700" fill="#047857">苏州百度云 VPC</text>
  <text x="502" y="174" font-size="13" fill="#047857">10.x.0.0/22</text>
  <text x="502" y="196" font-size="13" fill="#047857">云间互联网关</text>
  <text x="502" y="216" font-size="13" fill="#047857">对等连接本端</text>
  <rect x="760" y="110" width="200" height="120" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="782" y="146" font-size="17" font-weight="700" fill="#1e40af">北京百度云 VPC</text>
  <text x="782" y="174" font-size="13" fill="#1e40af">10.x.20.0/22</text>
  <text x="782" y="196" font-size="13" fill="#1e40af">BLB 内网 VIP</text>
  <text x="782" y="216" font-size="13" fill="#1e40af">→ 开发机 sshd</text>
  <line x1="182" y1="170" x2="248" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
  <text x="198" y="160" font-size="13" fill="#1e40af">专线</text>
  <text x="196" y="190" font-size="12" fill="#475569">约 10G</text>
  <line x1="412" y1="170" x2="478" y2="170" stroke="#2563eb" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="418" y="160" font-size="13" fill="#1e40af">云间互联</text>
  <text x="430" y="190" font-size="12" fill="#475569">10G</text>
  <line x1="662" y1="170" x2="758" y2="170" stroke="#2563eb" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="672" y="160" font-size="13" fill="#1e40af">VPC 对等连接</text>
  <text x="680" y="190" font-size="12" fill="#475569">跨地域</text>
  <text x="30" y="272" font-size="14" font-weight="700" fill="#b91c1c">关键点：百度侧通告的 10.x.0.0/16 同时覆盖苏州和北京两个 VPC，</text>
  <text x="30" y="296" font-size="14" font-weight="700" fill="#b91c1c">办公网“看起来有路由”，但苏州 VPC 不一定会把这部分流量转进对等连接</text>
  <rect x="20" y="320" width="940" height="128" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="350" font-size="14" font-weight="700" fill="#0f172a">分段核对（从北京往回测）</text>
  <text x="40" y="378" font-size="13" fill="#334155">1. 北京 VPC 内连 VIP 接入端口：确认开发机和 BLB 正常</text>
  <text x="40" y="402" font-size="13" fill="#334155">2. 苏州百度云 VPC 内连 VIP：确认对等连接和两端路由</text>
  <text x="40" y="426" font-size="13" fill="#334155">3. 火山云侧主机连 VIP：确认云间互联是否转发到北京</text>
  <text x="500" y="378" font-size="13" fill="#334155">4. 办公网连 VIP：最后一段，同时核对回程路由</text>
  <text x="500" y="402" font-size="13" fill="#334155">5. 北京 VPC 路由表要有回办公网、火山网段的路由</text>
  <text x="500" y="426" font-size="13" fill="#334155">6. 转发不支持时：CSN 统一互联 / 苏州跳板机 / 开发机建在苏州</text>
</svg>
