<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="900" height="430" fill="#f8fafc"/>
  <text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">fork 的写时复制（COW）</text>
  <text x="40" y="64" font-size="15" fill="#64748b">fork 后父子进程先共享只读物理页，任何一方写入时才复制</text>
  <rect x="70" y="105" width="170" height="80" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="105" y="138" font-size="17" font-weight="700" fill="#1e40af">父进程</text>
  <text x="95" y="165" font-size="13" fill="#334155">页表 A（只读）</text>
  <rect x="70" y="250" width="170" height="80" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="105" y="283" font-size="17" font-weight="700" fill="#166534">子进程</text>
  <text x="95" y="310" font-size="13" fill="#334155">页表 B（只读）</text>
  <rect x="390" y="170" width="200" height="100" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="420" y="208" font-size="16" font-weight="700" fill="#9a3412">物理页 P</text>
  <text x="420" y="238" font-size="13" fill="#9a3412">引用计数 = 2</text>
  <line x1="240" y1="145" x2="385" y2="195" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="240" y1="290" x2="385" y2="250" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="640" y="170" font-size="15" font-weight="700" fill="#0f172a">子进程写入 P：</text>
  <text x="640" y="198" font-size="13" fill="#334155">触发缺页异常</text>
  <text x="640" y="222" font-size="13" fill="#334155">内核复制新页 P'</text>
  <text x="640" y="246" font-size="13" fill="#334155">子进程页表指向 P'</text>
  <text x="640" y="270" font-size="13" fill="#334155">父进程继续用 P</text>
  <rect x="600" y="300" width="245" height="75" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="620" y="330" font-size="14" font-weight="700" fill="#1e40af">结果</text>
  <text x="620" y="354" font-size="13" fill="#334155">写操作彼此隔离，读操作仍共享</text>
</svg>
