<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="550" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Agent 工具调用循环</text>
<text x="40" y="64" font-size="15" fill="#64748b">模型负责决策，程序负责执行，循环直到任务完成</text>
<rect x="50.0" y="92.0" width="185.0" height="46.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="142.5" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">用户</text>
<rect x="255.0" y="92.0" width="185.0" height="46.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="347.5" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">应用程序</text>
<rect x="460.0" y="92.0" width="185.0" height="46.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="552.5" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">大模型</text>
<rect x="665.0" y="92.0" width="185.0" height="46.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="757.5" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">工具 / API</text>
<line x1="142.5" y1="138.0" x2="142.5" y2="482.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="347.5" y1="138.0" x2="347.5" y2="482.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="552.5" y1="138.0" x2="552.5" y2="482.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="757.5" y1="138.0" x2="757.5" y2="482.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="146.5" y1="168.0" x2="343.5" y2="168.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="245.0" y="160.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">提问：查一下北京明天天气，适合跑步吗</text>
<line x1="351.5" y1="210.0" x2="548.5" y2="210.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="202.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">问题 + 工具清单（JSON Schema）</text>
<line x1="548.5" y1="252.0" x2="351.5" y2="252.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="450.0" y="244.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">tool_call: get_weather(city=北京)</text>
<line x1="351.5" y1="294.0" x2="753.5" y2="294.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="552.5" y="286.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">执行函数</text>
<line x1="753.5" y1="336.0" x2="351.5" y2="336.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="552.5" y="328.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">{temp: 8, rain: false}</text>
<line x1="351.5" y1="378.0" x2="548.5" y2="378.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="370.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">把工具结果追加进对话</text>
<line x1="548.5" y1="420.0" x2="351.5" y2="420.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="450.0" y="412.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">最终回答（不再调用工具）</text>
<line x1="343.5" y1="462.0" x2="146.5" y2="462.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="245.0" y="454.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">明天 8 度无雨，适合跑步</text>
<text x="40.0" y="516.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">模型从不直接执行代码，只输出「想调用哪个工具、参数是什么」。要设最大循环次数，危险操作（删数据、转账）必须人工确认。</text>
</svg>
