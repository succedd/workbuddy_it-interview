<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="472" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">AI、机器学习、深度学习与大模型的关系</text>
<text x="40" y="64" font-size="15" fill="#64748b">从外到内一层包含一层，越往里越具体</text>
<rect x="40.0" y="92.0" width="670.0" height="56.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="230.0" y1="102.0" x2="230.0" y2="138.0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="135.0" y="125.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">人工智能 AI</text>
<text x="248.0" y="124.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">让机器表现出智能的所有方法，包括规则系统、搜索、专家系统</text>
<rect x="40.0" y="156.0" width="670.0" height="56.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<line x1="230.0" y1="166.0" x2="230.0" y2="202.0" stroke="#93c5fd" stroke-width="1.2"/>
<text x="135.0" y="189.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">机器学习 ML</text>
<text x="248.0" y="188.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">不写死规则，让程序从数据里自己学规律：决策树、SVM、XGBoost</text>
<rect x="40.0" y="220.0" width="670.0" height="56.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<line x1="230.0" y1="230.0" x2="230.0" y2="266.0" stroke="#6ee7b7" stroke-width="1.2"/>
<text x="135.0" y="253.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">深度学习 DL</text>
<text x="248.0" y="252.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">用多层神经网络学习，擅长图像、语音、文本：CNN、RNN、Transformer</text>
<rect x="40.0" y="284.0" width="670.0" height="56.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<line x1="230.0" y1="294.0" x2="230.0" y2="330.0" stroke="#fdba74" stroke-width="1.2"/>
<text x="135.0" y="317.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">大模型 LLM</text>
<text x="248.0" y="316.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">参数数十亿以上、海量数据预训练的 Transformer：GPT、Claude、Qwen</text>
<rect x="40.0" y="348.0" width="670.0" height="56.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<line x1="230.0" y1="358.0" x2="230.0" y2="394.0" stroke="#c4b5fd" stroke-width="1.2"/>
<text x="135.0" y="381.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">生成式 AI 应用</text>
<text x="248.0" y="380.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">基于大模型生成文字、图片、代码：ChatGPT、Copilot、Midjourney</text>
<path d="M720.0 98.0 H734.0 V206.0 H720.0" fill="none" stroke="#0f766e" stroke-width="2"/>
<text x="746.0" y="157.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700">传统方法</text>
<path d="M720.0 226.0 H734.0 V398.0 H720.0" fill="none" stroke="#0f766e" stroke-width="2"/>
<text x="746.0" y="317.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700">当前主流</text>
<text x="40.0" y="438.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">大模型是深度学习的一个分支，深度学习又是机器学习的一个分支。说「AI」时，现在大多指的是生成式 AI 和大模型。</text>
</svg>
