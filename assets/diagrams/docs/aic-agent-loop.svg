<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 248" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="248" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">命令行 Agent 的执行循环</text>
<text x="40" y="64" font-size="15" fill="#64748b">读、想、改、验，直到目标达成</text>
<rect x="40.0" y="92.0" width="144.8" height="88.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="112.4" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">理解任务</text>
<text x="112.4" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">读提示词和规则文件</text>
<rect x="208.8" y="92.0" width="144.8" height="88.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="281.2" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">收集上下文</text>
<text x="281.2" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">搜索、读取相关代码</text>
<line x1="187.8" y1="136.0" x2="205.8" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="377.6" y="92.0" width="144.8" height="88.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="450.0" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">修改代码</text>
<text x="450.0" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">编辑文件，需要时请</text>
<text x="450.0" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">求授权</text>
<line x1="356.6" y1="136.0" x2="374.6" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="546.4" y="92.0" width="144.8" height="88.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="618.8" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">运行验证</text>
<text x="618.8" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">跑测试、构建、代码</text>
<text x="618.8" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">检查</text>
<line x1="525.4" y1="136.0" x2="543.4" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="715.2" y="92.0" width="144.8" height="88.0" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
<text x="787.6" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">汇报结果</text>
<text x="787.6" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">说明改了什么、还剩</text>
<text x="787.6" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">什么</text>
<line x1="694.2" y1="136.0" x2="712.2" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="214.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">验证失败会回到收集上下文或修改代码。权限模式决定哪些命令需要人确认。</text>
</svg>
