<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="472" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">编程提示词五要素</text>
<text x="40" y="64" font-size="15" fill="#64748b">把需求说清楚，AI 才能一次做对</text>
<rect x="40.0" y="92.0" width="820.0" height="56.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<line x1="230.0" y1="102.0" x2="230.0" y2="138.0" stroke="#93c5fd" stroke-width="1.2"/>
<text x="135.0" y="125.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">目标</text>
<text x="248.0" y="124.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">要做成什么：例如给登录接口加失败次数限制</text>
<rect x="40.0" y="156.0" width="820.0" height="56.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<line x1="230.0" y1="166.0" x2="230.0" y2="202.0" stroke="#6ee7b7" stroke-width="1.2"/>
<text x="135.0" y="189.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">上下文</text>
<text x="248.0" y="188.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">相关文件、现有写法、技术栈和版本</text>
<rect x="40.0" y="220.0" width="820.0" height="56.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<line x1="230.0" y1="230.0" x2="230.0" y2="266.0" stroke="#fdba74" stroke-width="1.2"/>
<text x="135.0" y="253.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">约束</text>
<text x="248.0" y="252.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">不能改哪些地方、要兼容什么、不引入新依赖</text>
<rect x="40.0" y="284.0" width="820.0" height="56.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<line x1="230.0" y1="294.0" x2="230.0" y2="330.0" stroke="#c4b5fd" stroke-width="1.2"/>
<text x="135.0" y="317.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">验收标准</text>
<text x="248.0" y="316.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">怎样算完成：哪些测试要通过、边界情况</text>
<rect x="40.0" y="348.0" width="820.0" height="56.0" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
<line x1="230.0" y1="358.0" x2="230.0" y2="394.0" stroke="#86efac" stroke-width="1.2"/>
<text x="135.0" y="381.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">输出形式</text>
<text x="248.0" y="380.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">先给方案还是直接改、要不要解释</text>
<text x="40.0" y="438.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">不确定需求时，先让 AI 提问或给出方案，确认后再动手。</text>
</svg>
