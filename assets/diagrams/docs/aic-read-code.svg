<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 238" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="238" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">用 AI 读懂陌生项目</text>
<text x="40" y="64" font-size="15" fill="#64748b">从全局到细节，边问边验证</text>
<rect x="40.0" y="92.0" width="175.0" height="78.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="127.5" y="125.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">看全貌</text>
<text x="127.5" y="148.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">目录结构、README、依赖</text>
<rect x="255.0" y="92.0" width="175.0" height="78.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="342.5" y="125.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">找入口</text>
<text x="342.5" y="148.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">启动文件、路由、主流程</text>
<line x1="218.0" y1="131.0" x2="252.0" y2="131.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="470.0" y="92.0" width="175.0" height="78.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="557.5" y="125.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">追调用链</text>
<text x="557.5" y="148.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">一个请求经过哪些函数</text>
<line x1="433.0" y1="131.0" x2="467.0" y2="131.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="685.0" y="92.0" width="175.0" height="78.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="772.5" y="125.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">验证理解</text>
<text x="772.5" y="148.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">打断点或跑测试核对</text>
<line x1="648.0" y1="131.0" x2="682.0" y2="131.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="204.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">AI 的解释要对照源码核实。把读懂的结论写进文档或规则文件，后面的人和 AI 都能用。</text>
</svg>
