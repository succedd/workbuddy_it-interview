<text x="554.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">网页或文件里藏着恶意指令</text>
<rect x="456.0" y="231.0" width="196.0" height="84.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="554.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">防护</text>
<text x="554.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">外部内容当数据，敏感操作要确</text>
<text x="554.0" y="297.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">认</text>
<rect x="664.0" y="92.0" width="196.0" height="50.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
