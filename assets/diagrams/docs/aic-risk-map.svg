<text x="762.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">风险</text>
<text x="762.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">漏洞、幻觉依赖、许可证</text>
<rect x="664.0" y="231.0" width="196.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="762.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">防护</text>
<text x="762.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">代码审查、依赖检查、SAST</text>
<text x="40.0" y="349.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">企业使用前确认数据是否用于训练、存放在哪里，以及审计日志能否导出。</text>
