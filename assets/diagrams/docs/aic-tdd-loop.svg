<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 248" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="248" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">AI 辅助的测试驱动循环</text>
<text x="40" y="64" font-size="15" fill="#64748b">先让测试说清楚需求，再让 AI 写实现</text>
<rect x="40.0" y="92.0" width="144.8" height="88.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="112.4" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">写测试</text>
<text x="112.4" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">人定用例，或让 AI</text>
<text x="112.4" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">列边界情况</text>
<rect x="208.8" y="92.0" width="144.8" height="88.0" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
<text x="281.2" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">确认失败</text>
<text x="281.2" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">测试先跑红，证明有</text>
<text x="281.2" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">效</text>
<line x1="187.8" y1="136.0" x2="205.8" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="377.6" y="92.0" width="144.8" height="88.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="450.0" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">AI 写实现</text>
<text x="450.0" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">只为让测试通过</text>
<line x1="356.6" y1="136.0" x2="374.6" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="546.4" y="92.0" width="144.8" height="88.0" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
<text x="618.8" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">测试变绿</text>
<text x="618.8" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">全部通过再继续</text>
<line x1="525.4" y1="136.0" x2="543.4" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="715.2" y="92.0" width="144.8" height="88.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="787.6" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">审查重构</text>
<text x="787.6" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">检查改动，去掉多余</text>
<text x="787.6" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">代码</text>
<line x1="694.2" y1="136.0" x2="712.2" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="214.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">不要让 AI 为了通过测试去改测试。审查时重点看边界条件、错误处理和是否引入新依赖。</text>
</svg>
