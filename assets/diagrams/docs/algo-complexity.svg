<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="416" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">常见时间复杂度对比（n = 100 万）</text>
<text x="40" y="64" font-size="15" fill="#64748b">数据量上来后，复杂度决定能不能跑完</text>
<text x="40.0" y="117.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">O(1)</text>
<rect x="706.9" y="92.0" width="149.1" height="40.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="781.4" y="116.5" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">哈希查找 1 次</text>
<text x="40.0" y="171.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">O(log n)</text>
<rect x="644.6" y="146.0" width="211.4" height="40.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="750.3" y="170.5" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">二分查找 约 20 次</text>
<text x="40.0" y="225.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">O(n)</text>
<rect x="548.9" y="200.0" width="307.1" height="40.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="702.5" y="224.5" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">遍历 100 万次</text>
<text x="40.0" y="279.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">O(n log n)</text>
<rect x="429.3" y="254.0" width="426.7" height="40.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="642.6" y="278.5" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">排序 约 2000 万次</text>
<text x="40.0" y="333.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">O(n^2)</text>
<rect x="190.0" y="308.0" width="666.0" height="40.0" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
<text x="523.0" y="332.5" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">双重循环 1 万亿次，超时</text>
<text x="40.0" y="382.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">经验值：C++/Java 每秒约 1 亿次基本运算。n ≤ 10^5 时一般要 O(n log n) 以内，n ≤ 1000 才能接受 O(n^2)。</text>
</svg>
