<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 394" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="394" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Spring Bean 生命周期</text>
<text x="40" y="64" font-size="15" fill="#64748b">从 BeanDefinition 到销毁，扩展点都挂在这条链上</text>
<rect x="40.0" y="92.0" width="178.0" height="88.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="129.0" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">1 实例化</text>
<text x="129.0" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">反射调用构造器创建对象</text>
<rect x="254.0" y="92.0" width="178.0" height="88.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="343.0" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">2 属性注入</text>
<text x="343.0" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">@Autowired / setter</text>
<text x="343.0" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">填充依赖</text>
<line x1="221.0" y1="136.0" x2="251.0" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="468.0" y="92.0" width="178.0" height="88.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="557.0" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">3 Aware 回调</text>
<text x="557.0" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">BeanNameAware 等</text>
<text x="557.0" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">各类 *Aware 接口</text>
<line x1="435.0" y1="136.0" x2="465.0" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="682.0" y="92.0" width="178.0" height="88.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="771.0" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">4 前置处理</text>
<text x="771.0" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">BeanPostProcessor</text>
<text x="771.0" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">初始化前方法</text>
<line x1="649.0" y1="136.0" x2="679.0" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="40.0" y="220.0" width="178.0" height="106.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="129.0" y="249.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">5 初始化</text>
<text x="129.0" y="272.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">@PostConstruct →</text>
<text x="129.0" y="290.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">afterPropertiesSet →</text>
<text x="129.0" y="308.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">init-method</text>
<path d="M771.0 182.0 V198.0 H129.0 V217.0" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="254.0" y="220.0" width="178.0" height="106.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="343.0" y="249.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">6 后置处理</text>
<text x="343.0" y="272.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">BeanPostProcessor</text>
<text x="343.0" y="290.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">初始化后方法，AOP</text>
<text x="343.0" y="308.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">代理在这里生成</text>
<line x1="221.0" y1="273.0" x2="251.0" y2="273.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="468.0" y="220.0" width="178.0" height="106.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="557.0" y="258.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">7 使用</text>
<text x="557.0" y="281.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">放入单例池，被其他</text>
<text x="557.0" y="299.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">Bean 引用</text>
<line x1="435.0" y1="273.0" x2="465.0" y2="273.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="682.0" y="220.0" width="178.0" height="106.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="771.0" y="258.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">8 销毁</text>
<text x="771.0" y="281.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">@PreDestroy →</text>
<text x="771.0" y="299.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">destroy()，容器关闭时</text>
<line x1="649.0" y1="273.0" x2="679.0" y2="273.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="360.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">所以在构造器里拿不到被注入的依赖，在 @PostConstruct 里可以；同类内部方法互调不经过代理，@Transactional 会失效。</text>
</svg>
