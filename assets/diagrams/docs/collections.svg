<text x="40.0" y="540.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">HashMap 默认容量 16、负载因子 0.75，链表长度 ≥ 8 且容量 ≥ 64 时转红黑树。遍历时修改集合会触发 fail-fast 的</text>
<text x="40.0" y="560.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">ConcurrentModificationException。</text>
