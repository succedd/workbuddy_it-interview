<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 266" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="266" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">动态规划解题四步</text>
<text x="40" y="64" font-size="15" fill="#64748b">把大问题拆成重叠的子问题，记录结果不重复算</text>
<rect x="40.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="124.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">定义状态</text>
<text x="124.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">dp[i]</text>
<text x="124.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">表示什么，例如前 i</text>
<text x="124.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">个物品的最大价值</text>
<rect x="257.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="341.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">状态转移</text>
<text x="341.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">dp[i]</text>
<text x="341.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">由哪些更小的状态推出</text>
<line x1="212.0" y1="145.0" x2="254.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="474.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="558.5" y="139.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">初始化</text>
<text x="558.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">dp[0] 等边界值</text>
<line x1="429.0" y1="145.0" x2="471.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="691.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="775.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">遍历顺序</text>
<text x="775.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">保证用到的子状态已经算</text>
<text x="775.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">好，最后取答案</text>
<line x1="646.0" y1="145.0" x2="688.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="232.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">能用 DP 的两个信号：问「最多 / 最少 / 方案数」，并且做选择时只依赖之前的结果。先写出暴力递归，再加备忘录，最后改成递推表。</text>
</svg>
