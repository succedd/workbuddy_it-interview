<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 286" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="286" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">浏览器事件循环</text>
<text x="40" y="64" font-size="15" fill="#64748b">JS 单线程：一次只做一件事，做完再从队列里取下一件</text>
<rect x="40.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="124.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">执行一个宏任务</text>
<text x="124.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">script 整体</text>
<text x="124.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">setTimeout</text>
<text x="124.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">I/O、UI 事件</text>
<rect x="257.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="341.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">清空微任务队列</text>
<text x="341.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">Promise.then</text>
<text x="341.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">queueMicrotask</text>
<text x="341.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">新增的也一并清空</text>
<line x1="212.0" y1="145.0" x2="254.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="233.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">然后</text>
<rect x="474.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="558.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">需要时渲染</text>
<text x="558.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">rAF 回调</text>
<text x="558.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">样式 → 布局 → 绘制</text>
<text x="558.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">约 16.7ms 一帧</text>
<line x1="429.0" y1="145.0" x2="471.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">然后</text>
<rect x="691.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="775.5" y="139.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">取下一个宏任务</text>
<text x="775.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">回到第一步，循环往复</text>
<line x1="646.0" y1="145.0" x2="688.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="667.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">然后</text>
<text x="40.0" y="232.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">经典题：console.log(1); setTimeout(()=&gt;log(2)); Promise.resolve().then(()=&gt;log(3)); log(4) 输出 1 4 3</text>
<text x="40.0" y="252.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">2。一个长任务超过 50ms 就会卡住渲染和点击响应。</text>
</svg>
