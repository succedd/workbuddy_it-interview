<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="510" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Java 异常体系</text>
<text x="40" y="64" font-size="15" fill="#64748b">编译器只强制处理受检异常</text>
<rect x="260.0" y="92.0" width="380.0" height="70.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Throwable</text>
<text x="450.0" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">所有错误和异常的父类</text>
<line x1="450.0" y1="162.0" x2="450.0" y2="184.0" stroke="#2563eb" stroke-width="2"/>
<line x1="171.3" y1="184.0" x2="728.7" y2="184.0" stroke="#2563eb" stroke-width="2"/>
<line x1="171.3" y1="184.0" x2="171.3" y2="206.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="40.0" y="208.0" width="262.7" height="69.0" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
<text x="171.3" y="236.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Error</text>
<text x="171.3" y="259.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">JVM 级严重问题，一般不捕获</text>
<line x1="171.3" y1="277.0" x2="171.3" y2="289.0" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="48.0" y="289.0" width="246.7" height="43.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="171.3" y="315.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">OutOfMemoryError</text>
<line x1="171.3" y1="332.0" x2="171.3" y2="344.0" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="48.0" y="344.0" width="246.7" height="43.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="171.3" y="370.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">StackOverflowError</text>
<line x1="171.3" y1="387.0" x2="171.3" y2="399.0" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="48.0" y="399.0" width="246.7" height="43.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="171.3" y="425.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">NoClassDefFoundError</text>
<line x1="450.0" y1="184.0" x2="450.0" y2="206.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="318.7" y="208.0" width="262.7" height="69.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="450.0" y="236.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">受检异常 Exception</text>
<text x="450.0" y="259.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">必须 throws 或 try-catch</text>
<line x1="450.0" y1="277.0" x2="450.0" y2="289.0" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="326.7" y="289.0" width="246.7" height="43.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="315.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">IOException</text>
<line x1="450.0" y1="332.0" x2="450.0" y2="344.0" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="326.7" y="344.0" width="246.7" height="43.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="370.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">SQLException</text>
<line x1="450.0" y1="387.0" x2="450.0" y2="399.0" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="326.7" y="399.0" width="246.7" height="43.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="425.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">InterruptedException</text>
<line x1="728.7" y1="184.0" x2="728.7" y2="206.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="597.3" y="208.0" width="262.7" height="69.0" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.6"/>
<text x="728.7" y="236.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">RuntimeException</text>
<text x="728.7" y="259.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">非受检，多是代码 bug</text>
<line x1="728.7" y1="277.0" x2="728.7" y2="289.0" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="605.3" y="289.0" width="246.7" height="43.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="728.7" y="315.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">NullPointerException</text>
<line x1="728.7" y1="332.0" x2="728.7" y2="344.0" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="605.3" y="344.0" width="246.7" height="43.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="728.7" y="370.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">IllegalArgumentException</text>
<line x1="728.7" y1="387.0" x2="728.7" y2="399.0" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="605.3" y="399.0" width="246.7" height="43.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="728.7" y="425.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">IndexOutOfBoundsException</text>
<text x="40.0" y="476.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">日志里看根因要找最底下的 Caused by；捕获 InterruptedException 后要恢复中断标志 Thread.currentThread().interrupt()。</text>
</svg>
