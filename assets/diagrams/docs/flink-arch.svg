<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 286" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="286" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Flink 流处理与 Checkpoint</text>
<text x="40" y="64" font-size="15" fill="#64748b">有状态计算 + 定期快照，故障后从快照恢复</text>
<rect x="40.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="124.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Source</text>
<text x="124.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">Kafka 读取，记录消费</text>
<text x="124.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">offset</text>
<rect x="257.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="341.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">算子 + 状态</text>
<text x="341.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">keyBy</text>
<text x="341.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">后窗口聚合，状态存</text>
<text x="341.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">RocksDB</text>
<line x1="212.0" y1="145.0" x2="254.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="474.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="558.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Checkpoint</text>
<text x="558.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">JobManager 定期注入</text>
<text x="558.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">barrier，各算子快照状</text>
<text x="558.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">态</text>
<line x1="429.0" y1="145.0" x2="471.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="691.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="775.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Sink</text>
<text x="775.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">两阶段提交写 Kafka /</text>
<text x="775.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">数据库，实现端到端精确</text>
<text x="775.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">一次</text>
<line x1="646.0" y1="145.0" x2="688.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="232.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">事件时间 + Watermark 处理乱序数据；Watermark 表示「早于这个时间的数据基本到齐了」，迟到数据可用 allowedLateness</text>
<text x="40.0" y="252.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">或侧输出处理。</text>
</svg>
