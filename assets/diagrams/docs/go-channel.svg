<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="366" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">channel 的三种状态</text>
<text x="40" y="64" font-size="15" fill="#64748b">无缓冲是同步交接，有缓冲是队列</text>
<rect x="40.0" y="92.0" width="260.0" height="50.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="170.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">nil channel</text>
<rect x="40.0" y="154.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="170.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">发送 / 接收</text>
<text x="170.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">永久阻塞</text>
<rect x="40.0" y="231.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="170.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">close</text>
<text x="170.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">panic</text>
<rect x="320.0" y="92.0" width="260.0" height="50.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="450.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">正常 channel</text>
<rect x="320.0" y="154.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">无缓冲</text>
<text x="450.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">收发双方同时就绪才完成</text>
<rect x="320.0" y="231.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">有缓冲</text>
<text x="450.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">满了阻塞发送，空了阻塞接收</text>
<rect x="600.0" y="92.0" width="260.0" height="50.0" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
<text x="730.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">已关闭 channel</text>
<rect x="600.0" y="154.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="730.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">接收</text>
<text x="730.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">读完剩余数据后返回零值, ok=false</text>
<rect x="600.0" y="231.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="730.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">发送 / 再 close</text>
<text x="730.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">panic</text>
<text x="40.0" y="332.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">原则：由发送方关闭 channel，接收方用 for range 读到关闭为止；多个发送方时用 sync.WaitGroup 等全部结束再关。</text>
</svg>
