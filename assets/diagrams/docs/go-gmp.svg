<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="386" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Go 调度器 GMP 模型</text>
<text x="40" y="64" font-size="15" fill="#64748b">G 是任务，M 是系统线程，P 是执行资格</text>
<rect x="40.0" y="92.0" width="260.0" height="50.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="170.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">G goroutine</text>
<rect x="40.0" y="154.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="170.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">初始栈 2KB</text>
<text x="170.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">按需增长</text>
<rect x="40.0" y="231.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="170.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">go func()</text>
<text x="170.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">创建后放入 P 的本地队列</text>
<rect x="320.0" y="92.0" width="260.0" height="50.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="450.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">P Processor</text>
<rect x="320.0" y="154.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">数量 = GOMAXPROCS</text>
<text x="450.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">默认等于 CPU 核数</text>
<rect x="320.0" y="231.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">本地队列</text>
<text x="450.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">最多 256 个 G，满了放全局队列</text>
<rect x="600.0" y="92.0" width="260.0" height="50.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="730.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">M Machine</text>
<rect x="600.0" y="154.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="730.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">绑定一个 P</text>
<text x="730.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">才能执行 G</text>
<rect x="600.0" y="231.0" width="260.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="730.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">系统调用阻塞</text>
<text x="730.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">P 会被转交给其他 M</text>
<text x="40.0" y="332.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">P 的本地队列空了会去全局队列取，再不行就从别的 P 偷一半（work stealing）。Go 1.14</text>
<text x="40.0" y="352.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">起支持基于信号的异步抢占，死循环不会卡住调度。</text>
</svg>
