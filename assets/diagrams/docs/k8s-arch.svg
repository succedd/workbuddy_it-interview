<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="540" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Kubernetes 架构</text>
<text x="40" y="64" font-size="15" fill="#64748b">控制面负责「想要什么」，工作节点负责「让它发生」</text>
<rect x="40.0" y="92.0" width="390.0" height="50.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="235.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">控制面 Control Plane</text>
<rect x="40.0" y="154.0" width="390.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="235.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">kube-apiserver</text>
<text x="235.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">唯一入口，所有组件都和它通信</text>
<rect x="40.0" y="231.0" width="390.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="235.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">etcd</text>
<text x="235.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">保存全部集群状态</text>
<rect x="40.0" y="308.0" width="390.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="235.0" y="335.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">kube-scheduler</text>
<text x="235.0" y="357.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">决定 Pod 放哪个节点</text>
<rect x="40.0" y="385.0" width="390.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="235.0" y="412.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">controller-manager</text>
<text x="235.0" y="434.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">不断把实际状态调整为期望状态</text>
<rect x="470.0" y="92.0" width="390.0" height="50.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="665.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">工作节点 Node</text>
<rect x="470.0" y="154.0" width="390.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="665.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">kubelet</text>
<text x="665.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">按 PodSpec 启停容器、上报状态</text>
<rect x="470.0" y="231.0" width="390.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="665.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">容器运行时</text>
<text x="665.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">containerd 拉镜像、跑容器</text>
<rect x="470.0" y="308.0" width="390.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="665.0" y="335.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">kube-proxy</text>
<text x="665.0" y="357.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">把 Service 转成 iptables/IPVS 规则</text>
<rect x="470.0" y="385.0" width="390.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="665.0" y="412.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">CNI 插件</text>
<text x="665.0" y="434.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">给 Pod 分配 IP、打通网络</text>
<text x="40.0" y="486.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">kubectl apply 的过程：apiserver 写入 etcd → scheduler 绑定节点 → 该节点 kubelet 发现新 Pod → 调运行时创建容器 →</text>
<text x="40.0" y="506.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">上报 Running。</text>
</svg>
