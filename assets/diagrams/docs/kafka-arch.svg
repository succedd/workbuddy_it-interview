<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 266" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="266" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Kafka 核心架构</text>
<text x="40" y="64" font-size="15" fill="#64748b">Topic 拆成多个分区，分区是并行和有序的最小单位</text>
<rect x="40.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="124.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Producer</text>
<text x="124.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">按 key</text>
<text x="124.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">哈希选分区，acks=all</text>
<text x="124.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">保证不丢</text>
<rect x="257.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="341.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Broker 集群</text>
<text x="341.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">每个分区一个 Leader</text>
<text x="341.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">+ 多个 Follower</text>
<text x="341.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">副本（ISR）</text>
<line x1="212.0" y1="145.0" x2="254.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="474.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="558.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">分区日志</text>
<text x="558.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">顺序追加写，按 offset</text>
<text x="558.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">定位，按时间或大小保留</text>
<line x1="429.0" y1="145.0" x2="471.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="691.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="775.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Consumer Group</text>
<text x="775.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">组内每个分区只给一个消</text>
<text x="775.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">费者，提交 offset</text>
<text x="775.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">记录进度</text>
<line x1="646.0" y1="145.0" x2="688.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="232.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">同一个 key 进同一个分区才能保证顺序；消费者数量超过分区数，多出来的会空闲。Kafka 3.x 起可用 KRaft 模式去掉 ZooKeeper。</text>
</svg>
