<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 284" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="284" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">一个大模型从训练到上线</text>
<text x="40" y="64" font-size="15" fill="#64748b">前三步由模型厂商完成，后两步是应用团队的日常</text>
<rect x="40.0" y="92.0" width="141.6" height="124.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="110.8" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">预训练</text>
<text x="110.8" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">万亿 Token</text>
<text x="110.8" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">文本上学「预测下一</text>
<text x="110.8" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">个词」，得到基座模</text>
<text x="110.8" y="198.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">型</text>
<rect x="209.6" y="92.0" width="141.6" height="124.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="280.4" y="139.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">指令微调 SFT</text>
<text x="280.4" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">用问答对教模型按指</text>
<text x="280.4" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">令回答</text>
<line x1="184.6" y1="154.0" x2="206.6" y2="154.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="379.2" y="92.0" width="141.6" height="124.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="450.0" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">偏好对齐</text>
<text x="450.0" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">RLHF / DPO</text>
<text x="450.0" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">让回答更有用、更安</text>
<text x="450.0" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">全；推理模型再加强</text>
<text x="450.0" y="198.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">化学习</text>
<line x1="354.2" y1="154.0" x2="376.2" y2="154.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="548.8" y="92.0" width="141.6" height="124.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="619.6" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">压缩部署</text>
<text x="619.6" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">量化、蒸馏后用</text>
<text x="619.6" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">vLLM 等引擎提供</text>
<text x="619.6" y="189.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">API</text>
<line x1="523.8" y1="154.0" x2="545.8" y2="154.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="718.4" y="92.0" width="141.6" height="124.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="789.2" y="139.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">应用开发</text>
<text x="789.2" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">Prompt、RAG、Age</text>
<text x="789.2" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">nt、评测与监控</text>
<line x1="693.4" y1="154.0" x2="715.4" y2="154.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="250.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">基座模型（Base）只会续写，聊天模型（Instruct / Chat）才会按指令回答。开源权重模型可以自己下载、量化、微调。</text>
