<text x="746.0" y="349.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700">平台 / 算法团队</text>
<text x="40.0" y="438.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">大多数业务问题先用 Prompt 解决，不够再加 RAG 补知识，再不够才考虑微调；Agent 适合多步骤、要调用外部系统的任务。</text>
