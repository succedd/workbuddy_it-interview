<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="268" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">MVCC：版本链 + ReadView 决定「我能看到哪个版本」</text>
<text x="40" y="64" font-size="15" fill="#64748b">快照读不加锁，靠 undo log 里的历史版本实现</text>
<rect x="40.0" y="92.0" width="236.0" height="88.0" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
<text x="158.0" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">当前行  trx_id=300</text>
<text x="158.0" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">name=&#x27;王五&#x27;，roll_ptr</text>
<text x="158.0" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">指向上一版</text>
<rect x="332.0" y="92.0" width="236.0" height="88.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="450.0" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">undo 版本  trx_id=200</text>
<text x="450.0" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">name=&#x27;李四&#x27;</text>
<line x1="279.0" y1="136.0" x2="329.0" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="304.0" y="128.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">roll_ptr</text>
<rect x="624.0" y="92.0" width="236.0" height="88.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="742.0" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">undo 版本  trx_id=100</text>
<text x="742.0" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">name=&#x27;张三&#x27;</text>
<line x1="571.0" y1="136.0" x2="621.0" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="596.0" y="128.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">roll_ptr</text>
<text x="40.0" y="214.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">ReadView 记录：创建时的活跃事务列表 m_ids、最小活跃 id、下一个将分配的 id。从最新版本往回找，第一个「已提交且不在 m_ids</text>
<text x="40.0" y="234.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">中」的版本就是你看到的。RC 每条语句新建 ReadView，RR 整个事务只建一次，所以 RR 可重复读。</text>
</svg>
