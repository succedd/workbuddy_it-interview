<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 266" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="266" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">神经网络训练一轮在做什么</text>
<text x="40" y="64" font-size="15" fill="#64748b">前向算结果，比较误差，反向求梯度，更新参数</text>
<rect x="40.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="124.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">前向传播</text>
<text x="124.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">输入一批数据（batch）</text>
<text x="124.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">，逐层计算得到预测值</text>
<rect x="257.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="341.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">计算损失</text>
<text x="341.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">损失函数衡量预测和正确</text>
<text x="341.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">答案差多少</text>
<line x1="212.0" y1="145.0" x2="254.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="233.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">预测</text>
<rect x="474.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="558.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">反向传播</text>
<text x="558.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">从输出往回算每个参数对</text>
<text x="558.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">损失的影响（梯度）</text>
<line x1="429.0" y1="145.0" x2="471.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">误差</text>
<rect x="691.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="775.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">更新参数</text>
<text x="775.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">优化器按 学习率 ×</text>
<text x="775.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">梯度 调整参数，如</text>
<text x="775.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">AdamW</text>
<line x1="646.0" y1="145.0" x2="688.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="667.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">梯度</text>
<text x="40.0" y="232.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">把全部训练数据过一遍叫一个 epoch。训练集损失一直降、验证集损失开始升，说明过拟合了，应该早停或加正则。</text>
</svg>
