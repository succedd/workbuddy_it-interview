<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 286" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="286" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Linux 进程状态与转换</text>
<text x="40" y="64" font-size="15" fill="#64748b">ps / top 的 STAT 列看到的就是这些字母</text>
<rect x="40.0" y="92.0" width="163.0" height="106.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="121.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">新建</text>
<text x="121.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">fork() / clone()</text>
<text x="121.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">创建 task_struct</text>
<rect x="259.0" y="92.0" width="163.0" height="106.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="340.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">R 就绪 / 运行</text>
<text x="340.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">在 CPU</text>
<text x="340.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">运行队列里，等待或正</text>
<text x="340.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">在占用 CPU</text>
<line x1="206.0" y1="145.0" x2="256.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="231.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">调度</text>
<rect x="478.0" y="92.0" width="163.0" height="106.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="559.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">S / D 睡眠</text>
<text x="559.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">S 可被信号唤醒；D</text>
<text x="559.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">不可中断，多为等磁盘</text>
<text x="559.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">或 NFS</text>
<line x1="425.0" y1="145.0" x2="475.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">等 IO</text>
<rect x="697.0" y="92.0" width="163.0" height="106.0" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
<text x="778.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Z 僵尸</text>
<text x="778.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">已退出，等父进程</text>
<text x="778.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">wait() 回收退出码</text>
<line x1="644.0" y1="145.0" x2="694.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="669.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">exit</text>
<text x="40.0" y="232.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">S/D 在等待的事件完成后回到 R。D 状态进程 kill -9 也杀不掉，它会推高 load average；大量 Z 说明父进程没有调用</text>
<text x="40.0" y="252.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">wait()，要处理的是父进程。</text>
</svg>
