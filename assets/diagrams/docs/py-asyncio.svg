<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 266" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="266" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">asyncio 事件循环</text>
<text x="40" y="64" font-size="15" fill="#64748b">单线程里轮流推进多个协程，遇到 await IO 就让出</text>
<rect x="40.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="124.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">创建任务</text>
<text x="124.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">asyncio.create_task</text>
<text x="124.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">(coro) 放进就绪队列</text>
<rect x="257.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="341.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">运行到 await</text>
<text x="341.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">协程执行到 await 网络</text>
<text x="341.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">/ 磁盘 IO 时挂起</text>
<line x1="212.0" y1="145.0" x2="254.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="233.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">挂起</text>
<rect x="474.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="558.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">切换协程</text>
<text x="558.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">事件循环取下一个就绪任</text>
<text x="558.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">务继续执行</text>
<line x1="429.0" y1="145.0" x2="471.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">等待</text>
<rect x="691.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="775.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">IO 完成</text>
<text x="775.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">selector</text>
<text x="775.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">通知，挂起的协程重新变</text>
<text x="775.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">为就绪</text>
<line x1="646.0" y1="145.0" x2="688.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="667.0" y="137.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400">唤醒</text>
<text x="40.0" y="232.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">协程里调用 time.sleep 或同步 requests 会卡住整个循环；CPU 密集任务要交给 run_in_executor 或多进程。</text>
</svg>
