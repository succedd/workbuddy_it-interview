<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="376" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">RAG 检索增强生成流程</text>
<text x="40" y="64" font-size="15" fill="#64748b">离线建索引，在线检索后把资料塞进 Prompt</text>
<rect x="40.0" y="92.0" width="241.3" height="88.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="160.7" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">文档切分</text>
<text x="160.7" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">按标题 / 段落切块，300~800</text>
<text x="160.7" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">字，块间重叠 10%</text>
<rect x="329.3" y="92.0" width="241.3" height="88.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="450.0" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">向量化</text>
<text x="450.0" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">Embedding 模型把文本变成向量</text>
<line x1="284.3" y1="136.0" x2="326.3" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="618.7" y="92.0" width="241.3" height="88.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="739.3" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">入库</text>
<text x="739.3" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">向量库（Milvus / pgvector）+</text>
<text x="739.3" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">原文 + 元数据</text>
<line x1="573.7" y1="136.0" x2="615.7" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="40.0" y="220.0" width="241.3" height="88.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="160.7" y="258.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">用户提问</text>
<text x="160.7" y="281.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">问题同样向量化，可先做改写</text>
<path d="M739.3 182.0 V198.0 H160.7 V217.0" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="329.3" y="220.0" width="241.3" height="88.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="450.0" y="249.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">检索与重排</text>
<text x="450.0" y="272.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">向量 + 关键词混合召回</text>
<text x="450.0" y="290.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">Top-K，再用 Rerank 精排</text>
<line x1="284.3" y1="264.0" x2="326.3" y2="264.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="618.7" y="220.0" width="241.3" height="88.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="739.3" y="249.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">生成</text>
<text x="739.3" y="272.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">资料 + 问题拼进</text>
<text x="739.3" y="290.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">Prompt，要求标注出处</text>
<line x1="573.7" y1="264.0" x2="615.7" y2="264.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="342.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">答不准时先查检索：正确资料有没有被召回（召回率），再查生成：模型有没有照着资料答（忠实度）。</text>
</svg>
