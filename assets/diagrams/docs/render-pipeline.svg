<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="386" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">浏览器渲染流水线</text>
<text x="40" y="64" font-size="15" fill="#64748b">从 HTML 文本到屏幕像素</text>
<rect x="40.0" y="92.0" width="241.3" height="88.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="160.7" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">解析 HTML</text>
<text x="160.7" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">生成 DOM 树；遇到同步 script</text>
<text x="160.7" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">会暂停</text>
<rect x="329.3" y="92.0" width="241.3" height="88.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="450.0" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">解析 CSS</text>
<text x="450.0" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">生成 CSSOM，会阻塞渲染</text>
<line x1="284.3" y1="136.0" x2="326.3" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="618.7" y="92.0" width="241.3" height="88.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="739.3" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">样式计算</text>
<text x="739.3" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">DOM + CSSOM 合成渲染树</text>
<line x1="573.7" y1="136.0" x2="615.7" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="40.0" y="220.0" width="241.3" height="78.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="160.7" y="253.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">布局 Layout</text>
<text x="160.7" y="276.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">计算每个盒子的位置和大小</text>
<path d="M739.3 182.0 V198.0 H160.7 V217.0" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="329.3" y="220.0" width="241.3" height="78.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="450.0" y="253.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">绘制 Paint</text>
<text x="450.0" y="276.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">生成绘制指令，分图层</text>
<line x1="284.3" y1="259.0" x2="326.3" y2="259.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="618.7" y="220.0" width="241.3" height="78.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="739.3" y="253.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">合成 Composite</text>
<text x="739.3" y="276.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">GPU 合成图层显示到屏幕</text>
<line x1="573.7" y1="259.0" x2="615.7" y2="259.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="332.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">改 width/top 会触发重排（布局之后全部重来）；改 color 只重绘；改 transform/opacity 只走合成，最省。读 offsetHeight</text>
<text x="40.0" y="352.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">等属性会强制同步布局，循环里读写交替会导致布局抖动。</text>
</svg>
