<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="508" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">旁路缓存（Cache-Aside）读写流程</text>
<text x="40" y="64" font-size="15" fill="#64748b">最常用的缓存模式：读时回填，写时删缓存</text>
<rect x="81.7" y="92.0" width="190.0" height="46.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="176.7" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">应用</text>
<rect x="355.0" y="92.0" width="190.0" height="46.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="450.0" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Redis 缓存</text>
<rect x="628.3" y="92.0" width="190.0" height="46.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="723.3" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">数据库</text>
<line x1="176.7" y1="138.0" x2="176.7" y2="440.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="450.0" y1="138.0" x2="450.0" y2="440.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="723.3" y1="138.0" x2="723.3" y2="440.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="180.7" y1="168.0" x2="446.0" y2="168.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="313.3" y="160.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">读：GET key</text>
<line x1="446.0" y1="210.0" x2="180.7" y2="210.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="313.3" y="202.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">未命中</text>
<line x1="180.7" y1="252.0" x2="719.3" y2="252.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="244.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">查数据库</text>
<line x1="719.3" y1="294.0" x2="180.7" y2="294.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="450.0" y="286.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">返回数据</text>
<line x1="180.7" y1="336.0" x2="446.0" y2="336.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="313.3" y="328.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">SET key 并设过期时间</text>
<line x1="180.7" y1="378.0" x2="719.3" y2="378.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="370.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">写：先更新数据库</text>
<line x1="180.7" y1="420.0" x2="446.0" y2="420.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="313.3" y="412.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">再删除缓存 DEL key</text>
<text x="40.0" y="474.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">写操作删缓存而不是更新缓存，避免并发写导致脏数据。缓存穿透用空值缓存或布隆过滤器，击穿用互斥锁，雪崩用随机过期时间。</text>
</svg>
