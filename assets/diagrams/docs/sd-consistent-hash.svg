<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 443" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="443" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">分片路由：取模哈希 vs 一致性哈希</text>
<text x="40" y="64" font-size="15" fill="#64748b">扩容时要迁移多少数据</text>
<rect x="40.0" y="92.0" width="262.7" height="50.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="171.3" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">取模哈希 hash % N</text>
<rect x="40.0" y="154.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="171.3" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">路由</text>
<text x="171.3" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">简单，分布均匀</text>
<rect x="40.0" y="231.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="171.3" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">扩容 N→N+1</text>
<text x="171.3" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">大部分数据要迁移</text>
<rect x="40.0" y="308.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="171.3" y="335.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">适用</text>
<text x="171.3" y="357.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">分片数固定或可预先规划</text>
<rect x="318.7" y="92.0" width="262.7" height="50.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="450.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">一致性哈希</text>
<rect x="318.7" y="154.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">路由</text>
<text x="450.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">节点和 key 映射到环上，顺时针找节点</text>
<rect x="318.7" y="231.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">扩容</text>
<text x="450.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">只迁移相邻一段数据</text>
<rect x="318.7" y="308.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="335.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">虚拟节点</text>
<text x="450.0" y="357.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">每台机器多个点，解决倾斜</text>
<rect x="597.3" y="92.0" width="262.7" height="50.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="728.7" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">范围分片</text>
<rect x="597.3" y="154.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="728.7" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">路由</text>
<text x="728.7" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">按 ID 或时间区间</text>
<rect x="597.3" y="231.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="728.7" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">扩容</text>
<text x="728.7" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">新增区间即可</text>
<rect x="597.3" y="308.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="728.7" y="335.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">风险</text>
<text x="728.7" y="357.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">新数据集中在最后一片</text>
<text x="40.0" y="409.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">数据库分库分表常用取模加预分配（例如一开始就分 1024 张表），缓存集群常用一致性哈希。</text>
</svg>
