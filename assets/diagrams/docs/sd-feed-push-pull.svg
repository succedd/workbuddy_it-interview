<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 443" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="443" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Feed 流：推模式 vs 拉模式</text>
<text x="40" y="64" font-size="15" fill="#64748b">写扩散还是读扩散</text>
<rect x="40.0" y="92.0" width="262.7" height="50.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="171.3" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">推模式（写扩散）</text>
<rect x="40.0" y="154.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="171.3" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">发帖时</text>
<text x="171.3" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">写入每个粉丝的收件箱</text>
<rect x="40.0" y="231.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="171.3" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">读</text>
<text x="171.3" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">直接读自己收件箱，很快</text>
<rect x="40.0" y="308.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="171.3" y="335.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">问题</text>
<text x="171.3" y="357.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">大 V 千万粉丝，写入放大</text>
<rect x="318.7" y="92.0" width="262.7" height="50.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="450.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">拉模式（读扩散）</text>
<rect x="318.7" y="154.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">发帖时</text>
<text x="450.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">只写自己的发件箱</text>
<rect x="318.7" y="231.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">读</text>
<text x="450.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">合并所有关注者的发件箱</text>
<rect x="318.7" y="308.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="450.0" y="335.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">问题</text>
<text x="450.0" y="357.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">关注多时读取慢</text>
<rect x="597.3" y="92.0" width="262.7" height="50.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="728.7" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">推拉结合</text>
<rect x="597.3" y="154.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="728.7" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">普通用户</text>
<text x="728.7" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">推给粉丝</text>
<rect x="597.3" y="231.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="728.7" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">大 V</text>
<text x="728.7" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">粉丝读时再拉</text>
<rect x="597.3" y="308.0" width="262.7" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="728.7" y="335.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">活跃度</text>
<text x="728.7" y="357.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">只推给近期活跃粉丝</text>
<text x="40.0" y="409.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">主流方案是推拉结合：收件箱用 Redis ZSET 按时间排序，只保留最近几百条，更早的回源查询。</text>
</svg>
