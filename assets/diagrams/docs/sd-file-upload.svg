<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="466" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">大文件分片上传</text>
<text x="40" y="64" font-size="15" fill="#64748b">秒传、断点续传、直传对象存储</text>
<rect x="81.7" y="92.0" width="190.0" height="46.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="176.7" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">客户端</text>
<rect x="355.0" y="92.0" width="190.0" height="46.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="450.0" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">文件服务</text>
<rect x="628.3" y="92.0" width="190.0" height="46.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="723.3" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">对象存储</text>
<line x1="176.7" y1="138.0" x2="176.7" y2="398.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="450.0" y1="138.0" x2="450.0" y2="398.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="723.3" y1="138.0" x2="723.3" y2="398.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="180.7" y1="168.0" x2="446.0" y2="168.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="313.3" y="160.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">初始化：文件哈希 + 大小</text>
<line x1="446.0" y1="210.0" x2="180.7" y2="210.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="313.3" y="202.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">已存在则秒传，否则返回 uploadId</text>
<line x1="180.7" y1="252.0" x2="719.3" y2="252.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="244.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">按预签名 URL 并发上传各分片</text>
<line x1="180.7" y1="294.0" x2="446.0" y2="294.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="313.3" y="286.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">通知全部分片完成</text>
<line x1="454.0" y1="336.0" x2="719.3" y2="336.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="586.7" y="328.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">合并分片，校验哈希</text>
<line x1="446.0" y1="378.0" x2="180.7" y2="378.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="313.3" y="370.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">返回文件地址</text>
<text x="40.0" y="432.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">文件数据直传对象存储，不经过应用服务器。下载走 CDN，按文件哈希去重节省存储。</text>
</svg>
