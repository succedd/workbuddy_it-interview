<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 266" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="266" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">系统设计四步答题法</text>
<text x="40" y="64" font-size="15" fill="#64748b">45 分钟面试的时间分配，先问清再动手</text>
<rect x="40.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="124.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">澄清需求</text>
<text x="124.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">功能、非功能、约束，约</text>
<text x="124.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">5 分钟</text>
<rect x="257.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="341.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">估算量级</text>
<text x="341.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">QPS、存储、带宽，约 5</text>
<text x="341.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">分钟</text>
<line x1="212.0" y1="145.0" x2="254.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="474.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="558.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">高层设计</text>
<text x="558.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">API、数据模型、主流程</text>
<text x="558.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">，约 15 分钟</text>
<line x1="429.0" y1="145.0" x2="471.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="691.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="775.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">深入设计</text>
<text x="775.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">挑 1~2</text>
<text x="775.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">个难点讲方案与取舍，约</text>
<text x="775.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">15 分钟</text>
<line x1="646.0" y1="145.0" x2="688.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="232.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">最后留 3~5 分钟总结瓶颈、单点和监控。每个设计决定都要能回到第一步确认的需求上。</text>
</svg>
