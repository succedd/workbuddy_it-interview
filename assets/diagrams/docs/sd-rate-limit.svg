<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="366" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">常见限流算法</text>
<text x="40" y="64" font-size="15" fill="#64748b">按允许突发和实现复杂度选择</text>
<rect x="40.0" y="92.0" width="196.0" height="50.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="138.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">固定窗口</text>
<rect x="40.0" y="154.0" width="196.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="138.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">做法</text>
<text x="138.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">每个时间窗口计数</text>
<rect x="40.0" y="231.0" width="196.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="138.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">问题</text>
<text x="138.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">窗口边界可能翻倍</text>
<rect x="248.0" y="92.0" width="196.0" height="50.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="346.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">滑动窗口</text>
<rect x="248.0" y="154.0" width="196.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="346.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">做法</text>
<text x="346.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">按时间戳记录或分小格</text>
<rect x="248.0" y="231.0" width="196.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="346.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">特点</text>
<text x="346.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">更平滑，耗内存</text>
<rect x="456.0" y="92.0" width="196.0" height="50.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="554.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">令牌桶</text>
<rect x="456.0" y="154.0" width="196.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="554.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">做法</text>
<text x="554.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">匀速放令牌，取到才放行</text>
<rect x="456.0" y="231.0" width="196.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="554.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">特点</text>
<text x="554.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">允许一定突发</text>
<rect x="664.0" y="92.0" width="196.0" height="50.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="762.0" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">漏桶</text>
<rect x="664.0" y="154.0" width="196.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="762.0" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">做法</text>
<text x="762.0" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">请求排队，匀速流出</text>
<rect x="664.0" y="231.0" width="196.0" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="762.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">特点</text>
<text x="762.0" y="280.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">输出绝对平滑</text>
<text x="40.0" y="332.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">分布式限流把计数放 Redis，用 Lua 保证原子性。被限流的请求返回 429 和 Retry-After。</text>
</svg>
