<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="366" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">从单机到百万用户的架构演进</text>
<text x="40" y="64" font-size="15" fill="#64748b">每一步解决上一步的瓶颈</text>
<rect x="40.0" y="92.0" width="241.3" height="78.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="160.7" y="125.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">单机</text>
<text x="160.7" y="148.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">应用和数据库在一台机器</text>
<rect x="329.3" y="92.0" width="241.3" height="78.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="450.0" y="125.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">应用与数据库分离</text>
<text x="450.0" y="148.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">各自独立扩容</text>
<line x1="284.3" y1="131.0" x2="326.3" y2="131.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="618.7" y="92.0" width="241.3" height="78.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="739.3" y="125.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">负载均衡 + 多实例</text>
<text x="739.3" y="148.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">应用无状态，水平扩展</text>
<line x1="573.7" y1="131.0" x2="615.7" y2="131.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="40.0" y="210.0" width="241.3" height="88.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="160.7" y="248.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">主从复制</text>
<text x="160.7" y="271.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">写主库、读从库</text>
<path d="M739.3 172.0 V188.0 H160.7 V207.0" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="329.3" y="210.0" width="241.3" height="88.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="450.0" y="239.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">缓存 + CDN</text>
<text x="450.0" y="262.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">热点数据进 Redis，静态资源上</text>
<text x="450.0" y="280.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">CDN</text>
<line x1="284.3" y1="254.0" x2="326.3" y2="254.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="618.7" y="210.0" width="241.3" height="88.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="739.3" y="248.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">分库分表 + 消息队列</text>
<text x="739.3" y="271.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">数据拆分，异步解耦</text>
<line x1="573.7" y1="254.0" x2="615.7" y2="254.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="332.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">不要一开始就上最终架构。先找到当前瓶颈（CPU、连接数、磁盘、单表行数），再加对应的组件。</text>
</svg>
