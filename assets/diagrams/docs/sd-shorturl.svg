<line x1="693.4" y1="145.0" x2="715.4" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="232.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">7 位 Base62 约 3.5 万亿个短码。跳转用 302 能统计点击，用 301 能减少服务端压力。</text>
