<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="268" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">搜索自动补全</text>
<text x="40" y="64" font-size="15" fill="#64748b">离线统计热词，在线按前缀查 Top K</text>
<rect x="40.0" y="92.0" width="141.6" height="108.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="110.8" y="131.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">搜索日志</text>
<text x="110.8" y="154.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">收集用户输入的查询</text>
<text x="110.8" y="172.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">词</text>
<rect x="209.6" y="92.0" width="141.6" height="108.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="280.4" y="140.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">离线聚合</text>
<text x="280.4" y="163.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">按周期统计词频</text>
<line x1="184.6" y1="146.0" x2="206.6" y2="146.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="379.2" y="92.0" width="141.6" height="108.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="450.0" y="131.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">构建 Trie</text>
<text x="450.0" y="154.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">每个节点缓存该前缀</text>
<text x="450.0" y="172.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">的 Top K 热词</text>
<line x1="354.2" y1="146.0" x2="376.2" y2="146.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="548.8" y="92.0" width="141.6" height="108.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="619.6" y="131.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">补全服务</text>
<text x="619.6" y="154.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">按前缀找节点，直接</text>
<text x="619.6" y="172.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">返回 Top K</text>
<line x1="523.8" y1="146.0" x2="545.8" y2="146.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="718.4" y="92.0" width="141.6" height="108.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="789.2" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">浏览器 / CDN</text>
<text x="789.2" y="141.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">缓存</text>
<text x="789.2" y="164.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">相同前缀短时间内不</text>
<text x="789.2" y="182.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">再请求</text>
<line x1="693.4" y1="146.0" x2="715.4" y2="146.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="234.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">在节点上预存 Top K，查询复杂度只和前缀长度有关。前端加防抖，减少每敲一个字就请求一次。</text>
</svg>
