<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 266" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="266" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">SLI → SLO → 错误预算</text>
<text x="40" y="64" font-size="15" fill="#64748b">用数字约定「多可靠才够」，并据此决定发版节奏</text>
<rect x="40.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="124.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">SLI 指标</text>
<text x="124.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">例：成功请求数 /</text>
<text x="124.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">总请求数</text>
<rect x="257.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="341.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">SLO 目标</text>
<text x="341.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">例：30 天可用性 ≥</text>
<text x="341.5" y="171.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">99.9%</text>
<line x1="212.0" y1="145.0" x2="254.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="474.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="558.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">错误预算</text>
<text x="558.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">100% − 99.9% =</text>
<text x="558.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">0.1%，约 43 分钟 /</text>
<text x="558.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">30 天</text>
<line x1="429.0" y1="145.0" x2="471.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="691.0" y="92.0" width="169.0" height="106.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="775.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">决策</text>
<text x="775.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">预算充足照常发版；快耗</text>
<text x="775.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">尽时冻结变更、优先修稳</text>
<text x="775.5" y="180.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">定性</text>
<line x1="646.0" y1="145.0" x2="688.0" y2="145.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="232.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">告警建议按「预算消耗速度」（burn rate）配置：1 小时内烧掉 2% 预算就要立即处理。SLA 是对外合同，通常比内部 SLO 更宽松。</text>
</svg>
