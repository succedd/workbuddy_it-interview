<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="326" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">STRIDE 威胁建模</text>
<text x="40" y="64" font-size="15" fill="#64748b">对每个组件和数据流逐项提问：会不会出现这类威胁</text>
<rect x="40.0" y="92.0" width="128.3" height="50.0" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
<text x="104.2" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">S 仿冒</text>
<rect x="40.0" y="154.0" width="128.3" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="104.2" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">冒充他人身份</text>
<text x="104.2" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">对策：认证、MFA</text>
<rect x="178.3" y="92.0" width="128.3" height="50.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="242.5" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">T 篡改</text>
<rect x="178.3" y="154.0" width="128.3" height="84.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="242.5" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">修改数据或代码</text>
<text x="242.5" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">对策：签名、完整</text>
<text x="242.5" y="220.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">性校验</text>
<rect x="316.7" y="92.0" width="128.3" height="50.0" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.6"/>
<text x="380.8" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">R 抵赖</text>
<rect x="316.7" y="154.0" width="128.3" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="380.8" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">否认做过某操作</text>
<text x="380.8" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">对策：审计日志</text>
<rect x="455.0" y="92.0" width="128.3" height="50.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="519.2" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">I 信息泄露</text>
<rect x="455.0" y="154.0" width="128.3" height="84.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="519.2" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">看到不该看的</text>
<text x="519.2" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">对策：加密、最小</text>
<text x="519.2" y="220.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">权限</text>
<rect x="593.3" y="92.0" width="128.3" height="50.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="657.5" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">D 拒绝服务</text>
<rect x="593.3" y="154.0" width="128.3" height="67.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="657.5" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">让服务不可用</text>
<text x="657.5" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">对策：限流、弹性</text>
<rect x="731.7" y="92.0" width="128.3" height="50.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="795.8" y="123.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">E 权限提升</text>
<rect x="731.7" y="154.0" width="128.3" height="84.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="795.8" y="181.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">获得更高权限</text>
<text x="795.8" y="203.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">对策：授权校验、</text>
<text x="795.8" y="220.0" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">隔离</text>
<text x="40.0" y="272.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">做法：先画数据流图（外部实体、进程、存储、数据流、信任边界），再对跨越信任边界的每条数据流过一遍</text>
<text x="40.0" y="292.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">STRIDE，记录威胁、等级和缓解措施。</text>
</svg>
