<text x="40.0" y="328.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">路由器只看 IP 头，交换机只看以太网头；每层的头只被对端的同一层解读。以太网 MTU 1500 字节 = IP 头 + TCP 头 + 最多 1460</text>
<text x="40.0" y="348.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">字节数据（MSS）。</text>
