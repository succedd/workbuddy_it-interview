<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">TCP/IP 封装：每往下一层就多一个头</text>
<text x="40" y="64" font-size="15" fill="#64748b">发送方自上而下加头，接收方自下而上剥头</text>
<text x="40.0" y="117.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">应用层</text>
