<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="600" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">TLS 1.3 握手（1-RTT）</text>
<text x="40" y="64" font-size="15" fill="#64748b">一个往返完成密钥协商和身份验证，之后全部加密</text>
<rect x="150.0" y="92.0" width="190.0" height="46.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="245.0" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">客户端</text>
<rect x="560.0" y="92.0" width="190.0" height="46.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="655.0" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">服务端</text>
<line x1="245.0" y1="138.0" x2="245.0" y2="512.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="655.0" y1="138.0" x2="655.0" y2="512.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="249.0" y1="168.0" x2="651.0" y2="168.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="160.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">ClientHello：支持的套件 + key_share（ECDHE 公钥）</text>
<line x1="651.0" y1="212.0" x2="249.0" y2="212.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="450.0" y="204.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">ServerHello：选定套件 + key_share</text>
<line x1="40.0" y1="246.0" x2="860.0" y2="246.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="327.5" y="235.0" width="245.0" height="22" rx="11" fill="#f8fafc"/>
<text x="450.0" y="251.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700">双方各自算出握手密钥，以下加密传输</text>
<line x1="651.0" y1="286.0" x2="249.0" y2="286.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="450.0" y="278.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">EncryptedExtensions、Certificate</text>
<line x1="651.0" y1="330.0" x2="249.0" y2="330.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="450.0" y="322.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">CertificateVerify（证明持有私钥）、Finished</text>
<rect x="160.0" y="350.0" width="170.0" height="34.0" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.6"/>
<text x="245.0" y="370.5" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">校验证书链、域名、有效期</text>
<line x1="249.0" y1="418.0" x2="651.0" y2="418.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="410.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">Finished</text>
<line x1="40.0" y1="452.0" x2="860.0" y2="452.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="342.8" y="441.0" width="214.3" height="22" rx="11" fill="#f8fafc"/>
<text x="450.0" y="457.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700">应用数据（HTTP 请求 / 响应）</text>
<line x1="249.0" y1="492.0" x2="651.0" y2="492.0" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="450.0" y="484.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">GET /  ⇄  200 OK</text>
<text x="40.0" y="546.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">TLS 1.2 需要 2-RTT；1.3 删掉了 RSA 密钥交换和不安全套件，只保留前向安全的 (EC)DHE。会话恢复可用 0-RTT，但 0-RTT</text>
<text x="40.0" y="566.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">数据可被重放，只能用于幂等请求。</text>
</svg>
