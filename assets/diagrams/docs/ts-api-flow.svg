<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="466" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">一次接口测试包含什么</text>
<text x="40" y="64" font-size="15" fill="#64748b">请求发出去，结果要逐项检查</text>
<rect x="81.7" y="92.0" width="190.0" height="46.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="176.7" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">测试工具</text>
<rect x="355.0" y="92.0" width="190.0" height="46.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="450.0" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">被测接口</text>
<rect x="628.3" y="92.0" width="190.0" height="46.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="723.3" y="120.5" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">数据库</text>
<line x1="176.7" y1="138.0" x2="176.7" y2="398.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="450.0" y1="138.0" x2="450.0" y2="398.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="723.3" y1="138.0" x2="723.3" y2="398.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="91.7" y="144.0" width="170.0" height="34.0" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.6"/>
<text x="176.7" y="164.5" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">准备数据：登录拿令牌</text>
<line x1="180.7" y1="210.0" x2="446.0" y2="210.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="313.3" y="202.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">发送请求：方法、URL、头、参数</text>
<line x1="454.0" y1="252.0" x2="719.3" y2="252.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="586.7" y="244.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">读写数据</text>
<line x1="446.0" y1="294.0" x2="180.7" y2="294.0" stroke="#0f766e" stroke-width="2" marker-end="url(#t)"/>
<text x="313.3" y="286.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="400">返回状态码和响应体</text>
<rect x="91.7" y="312.0" width="170.0" height="34.0" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.6"/>
<text x="176.7" y="332.5" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">断言：状态码、字段、耗时</text>
<line x1="180.7" y1="378.0" x2="719.3" y2="378.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="370.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">核对数据库是否正确写入</text>
<text x="40.0" y="432.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">除了正常请求，还要测参数缺失、类型错误、未登录、无权限和重复提交。</text>
</svg>
