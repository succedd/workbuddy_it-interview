<text x="450.0" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">开发定位并修改</text>
<line x1="356.6" y1="136.0" x2="374.6" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="546.4" y="92.0" width="144.8" height="88.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
