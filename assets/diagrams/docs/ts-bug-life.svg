<text x="787.6" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">测试回归通过</text>
<line x1="694.2" y1="136.0" x2="712.2" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="214.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">验证不通过就重新打开。不是缺陷、重复或暂不修复的，要写明原因再关闭。</text>
