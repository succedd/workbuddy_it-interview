<text x="112.4" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">新建</text>
<text x="112.4" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">测试提交缺陷报告</text>
