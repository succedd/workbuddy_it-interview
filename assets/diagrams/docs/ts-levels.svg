<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 248" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="248" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">测试的四个级别与常见类型</text>
<text x="40" y="64" font-size="15" fill="#64748b">从小到大逐层验证</text>
<rect x="40.0" y="92.0" width="175.0" height="88.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="127.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">单元测试</text>
<text x="127.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">一个函数或类，开发写</text>
<rect x="255.0" y="92.0" width="175.0" height="88.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="342.5" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">集成测试</text>
<text x="342.5" y="153.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">模块之间、接口和数据库</text>
<line x1="218.0" y1="136.0" x2="252.0" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="470.0" y="92.0" width="175.0" height="88.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="557.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">系统测试</text>
<text x="557.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">整个系统的功能、性能、</text>
<text x="557.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">安全</text>
<line x1="433.0" y1="136.0" x2="467.0" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<rect x="685.0" y="92.0" width="175.0" height="88.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="772.5" y="121.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">验收测试</text>
<text x="772.5" y="144.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">用户或产品确认是否满足</text>
<text x="772.5" y="162.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">需求</text>
<line x1="648.0" y1="136.0" x2="682.0" y2="136.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="40.0" y="214.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">按是否看代码分黑盒和白盒；按目的分功能、性能、安全、兼容性、回归测试。</text>
</svg>
