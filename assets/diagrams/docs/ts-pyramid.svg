<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="344" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">测试金字塔</text>
<text x="40" y="64" font-size="15" fill="#64748b">越往下越多、越快、越便宜</text>
<rect x="40.0" y="92.0" width="670.0" height="56.0" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
<line x1="230.0" y1="102.0" x2="230.0" y2="138.0" stroke="#fca5a5" stroke-width="1.2"/>
<text x="135.0" y="125.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">端到端测试 · 少量</text>
<text x="248.0" y="124.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">核心流程，最慢、最容易不稳定</text>
<rect x="40.0" y="156.0" width="670.0" height="56.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<line x1="230.0" y1="166.0" x2="230.0" y2="202.0" stroke="#fdba74" stroke-width="1.2"/>
<text x="135.0" y="179.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">集成 / 接口测试 ·</text>
<text x="135.0" y="199.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">适量</text>
<text x="248.0" y="188.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">模块之间和接口契约</text>
<rect x="40.0" y="220.0" width="670.0" height="56.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<line x1="230.0" y1="230.0" x2="230.0" y2="266.0" stroke="#6ee7b7" stroke-width="1.2"/>
<text x="135.0" y="253.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">单元测试 · 大量</text>
<text x="248.0" y="252.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">函数和类，秒级运行</text>
<path d="M720.0 98.0 H734.0 V270.0 H720.0" fill="none" stroke="#0f766e" stroke-width="2"/>
<text x="746.0" y="180.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700">CI</text>
<text x="746.0" y="198.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700">中由下往上执行</text>
<text x="40.0" y="310.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">提交时跑单元测试，合并前跑接口测试，每晚或发布前跑完整的端到端测试。</text>
</svg>
