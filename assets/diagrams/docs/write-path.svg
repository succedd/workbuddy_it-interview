<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="492" fill="#f8fafc"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">一次 write() 的数据落盘路径</text>
<text x="40" y="64" font-size="15" fill="#64748b">write 返回成功 ≠ 数据已在磁盘上</text>
<rect x="40.0" y="92.0" width="670.0" height="56.0" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<line x1="230.0" y1="102.0" x2="230.0" y2="138.0" stroke="#93c5fd" stroke-width="1.2"/>
<text x="135.0" y="125.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">应用程序</text>
<text x="248.0" y="124.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">调用 write(fd, buf, n)，数据从用户缓冲区拷进内核</text>
<rect x="40.0" y="156.0" width="670.0" height="56.0" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="230.0" y1="166.0" x2="230.0" y2="202.0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="135.0" y="189.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">VFS</text>
<text x="248.0" y="188.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">统一接口，按 inode 找到具体文件系统（ext4 / xfs）</text>
<rect x="40.0" y="220.0" width="670.0" height="56.0" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<line x1="230.0" y1="230.0" x2="230.0" y2="266.0" stroke="#fdba74" stroke-width="1.2"/>
<text x="135.0" y="253.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Page Cache</text>
<text x="248.0" y="252.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">数据写进页缓存并标记为脏页，write 到这里就返回了</text>
<rect x="40.0" y="284.0" width="670.0" height="56.0" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<line x1="230.0" y1="294.0" x2="230.0" y2="330.0" stroke="#6ee7b7" stroke-width="1.2"/>
<text x="135.0" y="317.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">文件系统 + 块层</text>
<text x="248.0" y="316.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">日志（journal）、IO 调度、合并请求</text>
<rect x="40.0" y="348.0" width="670.0" height="56.0" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<line x1="230.0" y1="358.0" x2="230.0" y2="394.0" stroke="#c4b5fd" stroke-width="1.2"/>
<text x="135.0" y="381.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">磁盘 / SSD</text>
<text x="248.0" y="380.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">设备自身还有易失缓存，需要 FLUSH 才算真正持久</text>
<path d="M720.0 98.0 H734.0 V270.0 H720.0" fill="none" stroke="#0f766e" stroke-width="2"/>
<text x="746.0" y="189.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700">很快，可能丢</text>
<path d="M720.0 290.0 H734.0 V398.0 H720.0" fill="none" stroke="#0f766e" stroke-width="2"/>
<text x="746.0" y="340.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700">fsync()</text>
<text x="746.0" y="358.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700">才保证到这里</text>
<text x="40.0" y="438.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">脏页由内核按 dirty_ratio / dirty_expire 定期回写；数据库在提交事务时调用 fsync 或使用</text>
<text x="40.0" y="458.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">O_DIRECT，就是为了不依赖这个时机。</text>
</svg>
