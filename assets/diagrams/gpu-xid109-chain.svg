<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="980" height="520" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">Xid 109 误报链路与治理前后对比</text>

  <text x="30" y="80" font-size="16" font-weight="700" fill="#b91c1c">治理前：一次应用侧超时，被放大成整机下线</text>
  <rect x="30" y="96" width="170" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="115" y="126" font-size="14" fill="#1e3a8a" text-anchor="middle">同卡混跑</text>
  <text x="115" y="148" font-size="13" fill="#1e3a8a" text-anchor="middle">长渲染 + CUDA</text>
  <rect x="225" y="96" width="170" height="78" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="310" y="126" font-size="14" fill="#7c2d12" text-anchor="middle">驱动报 Xid 109</text>
  <text x="310" y="148" font-size="13" fill="#7c2d12" text-anchor="middle">上下文切换超时</text>
  <rect x="420" y="96" width="170" height="78" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="505" y="126" font-size="14" fill="#7f1d1d" text-anchor="middle">HAS 判 P2</text>
  <text x="505" y="148" font-size="13" fill="#7f1d1d" text-anchor="middle">DP 同时标不健康</text>
  <rect x="615" y="96" width="170" height="78" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="700" y="126" font-size="14" fill="#7f1d1d" text-anchor="middle">自动屏蔽</text>
  <text x="700" y="148" font-size="13" fill="#7f1d1d" text-anchor="middle">报修 + 自愈</text>
  <rect x="810" y="96" width="140" height="78" rx="8" fill="#dc2626"/>
  <text x="880" y="126" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">控制台</text>
  <text x="880" y="148" font-size="13" fill="#ffffff" text-anchor="middle">「不可用」</text>
  <line x1="200" y1="135" x2="222" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="395" y1="135" x2="417" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="590" y1="135" x2="612" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="785" y1="135" x2="807" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="30" y="204" font-size="13" fill="#64748b">事后硬件证据：ECC 计数为 0、无显存行重映射、同卡相邻任务不受影响、多种 GPU 型号都出现</text>

  <line x1="30" y1="226" x2="950" y2="226" stroke="#e2e8f0" stroke-width="2"/>

  <text x="30" y="262" font-size="16" font-weight="700" fill="#15803d">治理后：HAS 降级 + DP 升级，两件事必须一起做</text>
  <rect x="30" y="280" width="445" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="50" y="312" font-size="15" font-weight="700" fill="#0f172a">只做 HAS 降级</text>
  <text x="50" y="344" font-size="14" fill="#334155">HAS 不再推 P2 告警</text>
  <text x="50" y="372" font-size="14" fill="#334155">DP 仍独立发现 Xid 109，把卡标为不健康</text>
  <text x="50" y="400" font-size="14" fill="#334155">低版本 DP 下 Xid 不会自恢复</text>
  <rect x="50" y="430" width="405" height="40" rx="6" fill="#fef2f2"/>
  <text x="252" y="456" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700">结果：节点照样「不可用」</text>

  <rect x="505" y="280" width="445" height="210" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="525" y="312" font-size="15" font-weight="700" fill="#0f172a">HAS 降级 + DP 升级</text>
  <text x="525" y="344" font-size="14" fill="#334155">HAS 不推 P2，不触发屏蔽和报修</text>
  <text x="525" y="372" font-size="14" fill="#334155">DP 不再因 Xid 109 自动置节点不可用</text>
  <text x="525" y="400" font-size="14" fill="#334155">受影响的只有当次任务，重投即可</text>
  <rect x="525" y="430" width="405" height="40" rx="6" fill="#f0fdf4"/>
  <text x="727" y="456" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">结果：节点保持可用</text>
</svg>
