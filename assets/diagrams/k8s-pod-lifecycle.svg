<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
  <rect width="900" height="430" fill="#f8fafc"/>
  <text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Kubernetes Pod 生命周期</text>
  <text x="40" y="64" font-size="15" fill="#64748b">从调度到终止：阶段、探针与优雅下线</text>
  <rect x="55" y="115" width="150" height="70" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="95" y="157" font-size="17" font-weight="700" fill="#1e40af">Pending</text>
  <rect x="265" y="115" width="150" height="70" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="305" y="157" font-size="17" font-weight="700" fill="#047857">Running</text>
  <rect x="475" y="60" width="170" height="65" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="505" y="100" font-size="16" font-weight="700" fill="#166534">Succeeded</text>
  <rect x="475" y="170" width="170" height="65" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="515" y="210" font-size="16" font-weight="700" fill="#b91c1c">Failed</text>
  <rect x="700" y="115" width="150" height="70" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="725" y="157" font-size="16" font-weight="700" fill="#9a3412">Terminating</text>
  <line x1="205" y1="150" x2="255" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="415" y1="135" x2="465" y2="100" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="415" y1="165" x2="465" y2="200" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="415" y1="150" x2="690" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="55" y="245" font-size="14" font-weight="700" fill="#0f172a">关键探针</text>
  <text x="55" y="272" font-size="13" fill="#334155">startupProbe：启动慢的应用，成功后其它探针才生效</text>
  <text x="55" y="296" font-size="13" fill="#334155">readinessProbe：失败则从 Service Endpoints 摘除，不重启</text>
  <text x="55" y="320" font-size="13" fill="#334155">livenessProbe：失败则重启容器，不能替代 readiness</text>
  <text x="55" y="344" font-size="13" fill="#334155">preStop + terminationGracePeriod：先摘流量，再处理完存量请求</text>
  <text x="55" y="380" font-size="13" fill="#64748b">注意：Pod 的 phase 是粗粒度状态；真正的就绪要看 Conditions 和探针结果。</text>
</svg>
