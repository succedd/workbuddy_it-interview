<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1.0">
  <title>OG Cover</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1E40AF 0%, #2563EB 50%, #7C3AED 100%);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    .circles { position: absolute; inset: 0; pointer-events: none; }
    .c1 { position: absolute; right: -120px; top: -120px; width: 520px; height: 520px; border-radius: 50%; background: rgba(255,255,255,.08); }
    .c2 { position: absolute; left: -80px; bottom: -180px; width: 480px; height: 480px; border-radius: 50%; background: rgba(255,255,255,.06); }
    .card {
      width: 1080px; height: 510px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 28px;
      padding: 60px 72px;
      display: flex; flex-direction: column; justify-content: space-between;
      backdrop-filter: blur(2px);
    }
    .brand { display: flex; align-items: center; gap: 18px; }
    .logo { width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,.20); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; }
    .brand h1 { font-size: 40px; font-weight: 700; letter-spacing: 1px; }
    .brand p { font-size: 20px; opacity: .78; margin-top: 6px; }
    .body { margin-top: 24px; }
    .body h2 { font-size: 52px; font-weight: 700; line-height: 1.35; max-width: 780px; }
    .body p { font-size: 26px; opacity: .82; margin-top: 18px; }
    .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .url { font-size: 22px; opacity: .9; letter-spacing: .5px; }
    .tagline { font-size: 20px; opacity: .75; }
  </style>
</head>
<body>
  <div class="circles"><div class="c1"></div><div class="c2"></div></div>
  <div class="card">
    <div class="brand">
      <div class="logo">IT</div>
      <div>
        <h1>IT 面试题库</h1>
        <p>it-interview.is-a.dev · 结构化面试题 · 岗位体系 · 模拟面试</p>
      </div>
    </div>
    <div class="body">
      <h2>覆盖 250+ 技术分类的面试题宝库</h2>
      <p>按岗位、年限、难度刷题 · 错题重练 · 模拟面试 · 收藏云端同步</p>
    </div>
    <div class="foot">
      <div class="tagline">手机 / 平板 / 电脑均可使用，面试前随时刷一题</div>
      <div class="url">it-interview.is-a.dev</div>
    </div>
  </div>
</body>
</html>
