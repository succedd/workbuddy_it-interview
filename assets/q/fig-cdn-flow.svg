<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <rect width="680" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arw-cdn1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arw-cdn2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="arw-cdn3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/>
    </marker>
  </defs>
  <text x="16" y="30" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#2563eb">CDN 加速原理:DNS 调度 → 边缘节点命中/回源</text>

  <!-- 第一阶段:DNS 调度 -->
  <rect x="10" y="46" width="660" height="180" rx="8" fill="#eff6ff" stroke="#9ca3af" stroke-width="1"/>
  <text x="26" y="68" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#2563eb">第一阶段:DNS/CNAME 智能调度</text>

  <rect x="30" y="90" width="96" height="44" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="78" y="108" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2937">用户</text>
  <text x="78" y="124" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6b7280">请求 www.a.com</text>

  <rect x="180" y="90" width="120" height="44" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="240" y="108" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2937">Local DNS</text>
  <text x="240" y="124" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6b7280">先查本地缓存</text>

  <rect x="354" y="90" width="130" height="44" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="419" y="108" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2937">网站授权 DNS</text>
  <text x="419" y="124" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6b7280">返回 CNAME 别名</text>

  <rect x="538" y="90" width="118" height="44" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="597" y="108" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#2563eb">CDN 调度系统</text>
  <text x="597" y="124" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6b7280">分配最佳节点 IP</text>

  <line x1="126" y1="112" x2="180" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arw-cdn1)"/>
  <line x1="300" y1="112" x2="354" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arw-cdn1)"/>
  <line x1="484" y1="112" x2="538" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arw-cdn1)"/>
  <line x1="538" y1="150" x2="126" y2="150" stroke="#059669" stroke-width="1.5" marker-end="url(#arw-cdn2)"/>
  <text x="332" y="146" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#059669">按 Local DNS 所属区域返回最近的边缘节点 IP,用户拿到 IP 后发起访问</text>

  <text x="26" y="186" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">接入 CDN 后,加速域名的解析记录改为 CNAME 指向 CDN 专属域名,公网解析返回的是边缘节点 IP 而非源站 IP(顺带隐藏源站)</text>
  <text x="26" y="206" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">注意:TTL 内 Local DNS 会缓存解析结果,调度变化要等缓存过期才生效</text>

  <!-- 第二阶段:命中/回源 -->
  <rect x="10" y="244" width="660" height="172" rx="8" fill="#eff6ff" stroke="#9ca3af" stroke-width="1"/>
  <text x="26" y="266" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#2563eb">第二阶段:边缘节点响应</text>

  <rect x="266" y="284" width="150" height="40" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="341" y="302" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#2563eb">边缘节点</text>
  <text x="341" y="317" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6b7280">离用户最近</text>

  <line x1="341" y1="210" x2="341" y2="284" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arw-cdn1)"/>

  <rect x="40" y="284" width="180" height="52" rx="8" fill="#f0fdf4" stroke="#059669"/>
  <text x="130" y="304" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#059669">缓存命中</text>
  <text x="130" y="322" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#059669">直接返回资源,请求结束</text>

  <line x1="266" y1="306" x2="220" y2="306" stroke="#059669" stroke-width="1.5" marker-end="url(#arw-cdn2)"/>
  <text x="243" y="298" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#059669">命中</text>

  <rect x="472" y="284" width="184" height="52" rx="8" fill="#fefce8" stroke="#b45309"/>
  <text x="564" y="304" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#b45309">缓存未命中/已过期</text>
  <text x="564" y="322" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#b45309">节点向源站发起回源请求</text>

  <line x1="416" y1="306" x2="472" y2="306" stroke="#b45309" stroke-width="1.5" marker-end="url(#arw-cdn3)"/>
  <text x="444" y="298" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#b45309">未命中</text>

  <rect x="440" y="356" width="120" height="40" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="500" y="374" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2937">源站</text>
  <text x="500" y="390" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#6b7280">原始资源所在地</text>

  <line x1="564" y1="336" x2="530" y2="356" stroke="#b45309" stroke-width="1.5" marker-end="url(#arw-cdn3)"/>
  <line x1="440" y1="384" x2="341" y2="324" stroke="#059669" stroke-width="1.5" marker-end="url(#arw-cdn2)"/>
  <text x="356" y="368" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#059669">取回资源后按缓存策略存入节点并返回用户</text>

  <text x="26" y="336" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">缓存命中率越高,回源越少,</text>
  <text x="26" y="354" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">源站压力越小,加速越明显</text>
  <text x="26" y="384" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">静态资源(图片/JS/CSS/视频)</text>
  <text x="26" y="402" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">最适合 CDN;动态请求走回源链路</text>

  <!-- 底部:刷新与穿透 -->
  <rect x="10" y="434" width="660" height="52" rx="6" fill="#fef2f2"/>
  <text x="26" y="454" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#dc2626">缓存刷新与穿透</text>
  <text x="26" y="474" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">资源更新后提交 URL/目录刷新,清掉节点旧缓存强制回源;刷新前用户可能读到旧版本;TTL 设置过长加剧不一致,过短降低命中率</text>
</svg>
