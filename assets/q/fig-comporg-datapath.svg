<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 245" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#5f6368"/></marker></defs>
<text x="340" y="28" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">单周期 CPU 数据通路（以 add $t0,$t1,$t2 为例）</text>
<rect x="40" y="90" width="70" height="44" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="75" y="115.0" font-size="13" fill="#202124" text-anchor="middle">PC</text>
<rect x="40" y="180" width="70" height="44" rx="6" fill="#e6f4ea" stroke="#0f9d58" stroke-width="1.5"/>
<text x="75" y="205.1" font-size="13" fill="#202124" text-anchor="middle">+4</text>
<rect x="160" y="90" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="205" y="107.0" font-size="13" fill="#202124" text-anchor="middle">指令存储器</text>
<text x="205" y="123.0" font-size="13" fill="#202124" text-anchor="middle">IM</text>
<rect x="300" y="90" width="110" height="54" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="355" y="104.0" font-size="13" fill="#202124" text-anchor="middle">寄存器堆</text>
<text x="355" y="120.0" font-size="13" fill="#202124" text-anchor="middle">RegFile</text>
<text x="355" y="136.1" font-size="13" fill="#202124" text-anchor="middle">读rs/rt 写rd</text>
<rect x="470" y="120" width="90" height="44" rx="6" fill="#e6f4ea" stroke="#0f9d58" stroke-width="1.5"/>
<text x="515" y="145.1" font-size="13" fill="#202124" text-anchor="middle">ALU</text>
<rect x="470" y="200" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="515" y="217.1" font-size="13" fill="#202124" text-anchor="middle">数据存储器</text>
<text x="515" y="233.1" font-size="13" fill="#202124" text-anchor="middle">DM</text>
<line x1="110" y1="112" x2="160" y2="112" stroke="#5f6368" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="75" y1="134" x2="75" y2="180" stroke="#5f6368" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="75" y1="202" x2="355" y2="117" stroke="#5f6368" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<line x1="250" y1="112" x2="300" y2="112" stroke="#5f6368" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="410" y1="117" x2="470" y2="142" stroke="#5f6368" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="560" y1="142" x2="560" y2="200" stroke="#5f6368" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="515" y1="164" x2="355" y2="168" stroke="#5f6368" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="340" y="205" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">取指：PC→IM 取指令；执行：RegFile 读 $t1,$t2 → ALU 相加 → 结果写回 $t0；PC+4 指向下一条。</text>
<text x="340" y="224" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">单周期：每条指令都用完整的一个时钟周期，长短指令均按最慢指令定周期 → 大量空闲。</text>
</svg>
