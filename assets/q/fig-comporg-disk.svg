<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#5f6368"/></marker></defs>
<text x="340" y="26" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">磁盘结构与容量计算（CHS / LBA）</text>
<ellipse cx="180" cy="150" rx="120" ry="46" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<ellipse cx="180" cy="150" rx="60" ry="23" fill="#fff" stroke="#5f6368" stroke-width="1.2"/>
<ellipse cx="180" cy="150" rx="14" ry="6" fill="#f1f3f4" stroke="#5f6368"/>
<text x="180" y="158" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">盘面/磁道/扇区</text>
<text x="180" y="210" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">一个盘面 = 若干同心磁道；每磁道分若干扇区（通常 512B）。</text>
<rect x="380" y="70" width="270" height="150" rx="8" fill="#f1f3f4" stroke="#5f6368"/>
<text x="392" y="94" font-size="12" fill="#1a73e8" text-anchor="start" font-weight="bold">容量公式</text>
<text x="392" y="118" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">容量 = 盘面数 × 柱面数(C)</text>
<text x="392" y="136" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">        × 每道扇区数(S)</text>
<text x="392" y="154" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">        × 每扇区字节(512)</text>
<text x="392" y="172" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">例：2 面 × 10000 柱面 ×</text>
<text x="392" y="190" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">      500 扇区 × 512B</text>
<text x="392" y="208" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">   = 2×10⁴×500×512 ≈ 5.12 GB</text>
<text x="392" y="226" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">LBA = (C×H + Hn)×S + Sn</text>
<text x="340" y="250" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">CHS（柱面/磁头/扇区）是物理寻址；LBA 是线性逻辑块号，BIOS/磁盘控制器内部转换。</text>
</svg>
