<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <defs>
    <marker id="arw-cp" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arw-cpg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="arw-cpgy" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#ffffff"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="28" y="32" font-size="14" font-weight="bold" fill="#2563eb">数据库连接池工作原理（以 HikariCP 为例）</text>

    <!-- 应用线程 -->
    <rect x="36" y="96" width="120" height="38" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="96" y="120" font-size="12" fill="#1f2937" text-anchor="middle">应用线程 1</text>
    <rect x="36" y="156" width="120" height="38" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="96" y="180" font-size="12" fill="#1f2937" text-anchor="middle">应用线程 2</text>
    <rect x="36" y="216" width="120" height="38" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="96" y="240" font-size="12" fill="#1f2937" text-anchor="middle">应用线程 3</text>

    <!-- 借 -->
    <line x1="156" y1="115" x2="238" y2="135" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arw-cp)"/>
    <line x1="156" y1="175" x2="238" y2="185" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arw-cp)"/>
    <text x="196" y="105" font-size="11" fill="#2563eb" text-anchor="middle">getConnection() 借</text>
    <!-- 还 -->
    <line x1="238" y1="205" x2="156" y2="235" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arw-cpg)"/>
    <text x="193" y="262" font-size="11" fill="#059669" text-anchor="middle">close() 归还</text>

    <!-- 连接池 -->
    <rect x="242" y="88" width="252" height="238" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="368" y="112" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">连接池（HikariPool）</text>
    <rect x="258" y="126" width="220" height="52" rx="6" fill="#f0fdf4" stroke="#059669"/>
    <text x="368" y="146" font-size="12" fill="#1f2937" text-anchor="middle">空闲连接队列（idle）</text>
    <text x="368" y="166" font-size="11" fill="#6b7280" text-anchor="middle">conn-1、conn-2 等待被借出</text>
    <rect x="258" y="186" width="220" height="52" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="368" y="206" font-size="12" fill="#1f2937" text-anchor="middle">借出连接集合（active）</text>
    <text x="368" y="226" font-size="11" fill="#6b7280" text-anchor="middle">conn-3 正在被线程使用</text>
    <rect x="258" y="246" width="220" height="52" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="368" y="266" font-size="12" fill="#1f2937" text-anchor="middle">等待队列（blocked）</text>
    <text x="368" y="286" font-size="11" fill="#6b7280" text-anchor="middle">拿不到连接的线程在此排队</text>

    <!-- 池与数据库 -->
    <line x1="494" y1="160" x2="566" y2="175" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arw-cpgy)"/>
    <text x="530" y="142" font-size="11" fill="#6b7280" text-anchor="middle">物理连接</text>
    <text x="530" y="210" font-size="11" fill="#6b7280" text-anchor="middle">创建 / 校验 / 销毁</text>
    <rect x="570" y="140" width="76" height="120" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="608" y="192" font-size="12" fill="#1f2937" text-anchor="middle">数据库</text>
    <text x="608" y="212" font-size="11" fill="#6b7280" text-anchor="middle">（MySQL）</text>

    <!-- 参数带 -->
    <rect x="36" y="344" width="298" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="52" y="364" font-size="11" fill="#1f2937">maximumPoolSize：池上限（默认 10，含空闲+借出）</text>
    <text x="52" y="384" font-size="11" fill="#1f2937">minimumIdle：最小空闲数（建议不设，用固定池）</text>
    <rect x="346" y="344" width="298" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="362" y="364" font-size="11" fill="#1f2937">connectionTimeout：排队上限（默认 30s，超时抛异常）</text>
    <text x="362" y="384" font-size="11" fill="#1f2937">leakDetectionThreshold：连接泄漏检测（默认 0 关闭）</text>

    <text x="340" y="432" font-size="11" fill="#dc2626" text-anchor="middle">池不是越大越好：线程切换反而变慢，官方参考公式 ≈ CPU 核数 × 2 + 有效磁盘数</text>
    <text x="340" y="456" font-size="11" fill="#6b7280" text-anchor="middle">连接用完必须归还（close 回池而非真关闭）；maxLifetime 防止长连接被服务端掐断</text>
  </g>
</svg>
