<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <rect width="680" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arw-ng1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arw-ng2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
  </defs>
  <text x="16" y="30" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Nagle 算法 × 延迟确认:小包传输为何死等 40ms</text>

  <!-- 两列生命线 -->
  <rect x="60" y="52" width="110" height="30" rx="8" fill="#eff6ff"/>
  <text x="115" y="72" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#2563eb">发送方</text>
  <rect x="510" y="52" width="110" height="30" rx="8" fill="#eff6ff"/>
  <text x="565" y="72" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#2563eb">接收方</text>
  <line x1="115" y1="88" x2="115" y2="380" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="565" y1="88" x2="565" y2="380" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- 步骤1 -->
  <line x1="115" y1="112" x2="565" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arw-ng1)"/>
  <text x="340" y="106" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">① 发出一个小包(小于 MSS,如 10 字节)</text>

  <!-- 步骤2 接收方延迟确认 -->
  <rect x="440" y="128" width="125" height="24" rx="6" fill="#fefce8"/>
  <text x="502" y="145" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#b45309">延迟确认计时中</text>
  <text x="575" y="160" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">无数据可捎带,先不回 ACK</text>

  <!-- 步骤3 发送方 Nagle 攒包 -->
  <rect x="40" y="176" width="150" height="46" rx="6" fill="#fef2f2"/>
  <text x="115" y="195" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#dc2626">Nagle 攒住后续小包</text>
  <text x="115" y="212" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#dc2626">未收 ACK,不许再发</text>

  <!-- 40ms 死等区间 -->
  <line x1="115" y1="112" x2="115" y2="286" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="130" y="236" width="290" height="30" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="275" y="256" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#dc2626">双方互相等待:40ms~200ms 死等区间</text>

  <!-- 步骤4 ACK 返回 -->
  <line x1="565" y1="286" x2="115" y2="286" stroke="#059669" stroke-width="1.5" marker-end="url(#arw-ng2)"/>
  <text x="340" y="280" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#059669">④ 延迟确认到期(Linux 最短 40ms、最大 200ms)才回 ACK</text>

  <!-- 步骤5 攒包发出 -->
  <line x1="115" y1="314" x2="565" y2="314" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arw-ng1)"/>
  <text x="340" y="308" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">⑤ 收到 ACK,攒着的小包才被发出</text>

  <!-- 原理注释 -->
  <rect x="30" y="336" width="300" height="84" rx="6" fill="#eff6ff"/>
  <text x="44" y="356" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Nagle 规则(默认开启)</text>
  <text x="44" y="376" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">满足其一才发送:① 攒够 ≥ MSS;</text>
  <text x="44" y="393" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">② 之前的数据已收到 ACK。</text>
  <text x="44" y="410" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">目的:减少小包,提高带宽利用率</text>

  <rect x="350" y="336" width="300" height="84" rx="6" fill="#eff6ff"/>
  <text x="364" y="356" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#2563eb">解法:按业务特点关闭</text>
  <text x="364" y="376" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">发送端 setsockopt(TCP_NODELAY)</text>
  <text x="364" y="393" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">接收端可设 TCP_QUICKACK 关闭延迟确认</text>
  <text x="364" y="410" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">telnet/ssh/RPC 等交互场景建议关闭</text>
</svg>
