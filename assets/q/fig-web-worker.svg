<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <marker id="arw-w1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#ffffff"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="24" y="32" font-size="14" font-weight="bold" fill="#2563eb">Web Worker：能力边界与主线程通信</text>

    <rect x="24" y="64" width="200" height="250" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="124" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">主线程（Main Thread）</text>
    <rect x="40" y="104" width="168" height="32" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="124" y="124" text-anchor="middle" font-size="12" fill="#1f2937">UI 渲染</text>
    <rect x="40" y="144" width="168" height="32" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="124" y="164" text-anchor="middle" font-size="12" fill="#1f2937">事件处理</text>
    <rect x="40" y="184" width="168" height="32" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="124" y="204" text-anchor="middle" font-size="12" fill="#1f2937">JS 执行</text>
    <rect x="40" y="228" width="168" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="124" y="245" text-anchor="middle" font-size="11" fill="#dc2626">长任务会阻塞渲染</text>
    <text x="124" y="261" text-anchor="middle" font-size="11" fill="#dc2626">与交互响应</text>

    <rect x="456" y="64" width="200" height="250" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="556" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">Worker 线程（后台）</text>
    <rect x="472" y="104" width="168" height="100" rx="6" fill="#f0fdf4" stroke="#059669"/>
    <text x="556" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">可以使用</text>
    <text x="556" y="140" text-anchor="middle" font-size="11" fill="#1f2937">标准 JS 与 JSON</text>
    <text x="556" y="156" text-anchor="middle" font-size="11" fill="#1f2937">fetch / XMLHttpRequest</text>
    <text x="556" y="172" text-anchor="middle" font-size="11" fill="#1f2937">WebSocket / IndexedDB</text>
    <text x="556" y="188" text-anchor="middle" font-size="11" fill="#1f2937">定时器、OffscreenCanvas</text>
    <rect x="472" y="216" width="168" height="84" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="556" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">不能访问</text>
    <text x="556" y="252" text-anchor="middle" font-size="11" fill="#1f2937">DOM / document</text>
    <text x="556" y="268" text-anchor="middle" font-size="11" fill="#1f2937">window 对象</text>
    <text x="556" y="284" text-anchor="middle" font-size="11" fill="#1f2937">同步弹窗（alert 等）</text>

    <text x="340" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">postMessage()</text>
    <line x1="232" y1="140" x2="448" y2="140" stroke="#9ca3af" marker-end="url(#arw-w1)"/>
    <text x="340" y="162" text-anchor="middle" font-size="11" fill="#6b7280">结构化克隆：数据被复制（不是共享）</text>

    <text x="340" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">postMessage() 回传</text>
    <line x1="448" y1="210" x2="232" y2="210" stroke="#9ca3af" marker-end="url(#arw-w1)"/>
    <text x="340" y="234" text-anchor="middle" font-size="11" fill="#6b7280">onmessage 接收，双向通信、各自独立作用域</text>

    <text x="340" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">Transferable 对象</text>
    <line x1="232" y1="280" x2="448" y2="280" stroke="#9ca3af" stroke-dasharray="6 4" marker-end="url(#arw-w1)"/>
    <text x="340" y="304" text-anchor="middle" font-size="11" fill="#6b7280">ArrayBuffer 转移所有权，零拷贝</text>

    <rect x="24" y="340" width="632" height="56" rx="8" fill="#f0fdf4" stroke="#059669"/>
    <text x="44" y="362" font-size="12" font-weight="bold" fill="#059669">适合丢给 Worker 的任务</text>
    <text x="44" y="382" font-size="11" fill="#1f2937">大数组排序/过滤、大数据 JSON 解析、图像像素处理、复杂数值计算——与 UI 无关的重计算</text>
  </g>
</svg>
