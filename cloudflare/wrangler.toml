name = "it-interview-stats"
main = "worker.js"
compatibility_date = "2024-09-23"

# KV 命名空间：先在 Cloudflare 后台创建一个 KV，把下面两处的 id 替换为真实 id
[[kv_namespaces]]
binding = "STATS"
id = "ef5539a2537d417c83141dd771c98454"

# 用户帐号库（D1 边缘 SQLite）：注册/登录/管理 + 个人数据云同步
[[d1_databases]]
binding = "USERS"
database_name = "it-interview-users"
database_id = "111f4eda-55e2-475d-b199-27e962dec4fc"

# 可选：设置后，前端与 Worker 通信需要带 ?k= 一致的值（防刷）
# [vars]
# STATS_KEY = "改成你自己的随机字符串"
