<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="430" fill="#f8fafc"/>
  <text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">接雨水：双指针为什么正确</text>
  <text x="40" y="64" font-size="15" fill="#64748b">每个位置的水量 = max(0, min(leftMax, rightMax) − height[i])</text>
  <g transform="translate(60,90)">
    <line x1="0" y1="260" x2="780" y2="260" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#93c5fd">
      <rect x="0" y="220" width="55" height="40"/><rect x="65" y="180" width="55" height="80"/><rect x="130" y="220" width="55" height="40"/><rect x="195" y="120" width="55" height="140"/><rect x="260" y="180" width="55" height="80"/><rect x="325" y="220" width="55" height="40"/><rect x="390" y="180" width="55" height="80"/><rect x="455" y="60" width="55" height="200"/><rect x="520" y="120" width="55" height="140"/><rect x="585" y="180" width="55" height="80"/><rect x="650" y="120" width="55" height="140"/><rect x="715" y="180" width="55" height="80"/>
    </g>
    <g fill="#38bdf8" opacity=".75">
      <rect x="65" y="140" width="55" height="40"/><rect x="130" y="180" width="55" height="40"/><rect x="195" y="180" width="55" height="40"/><rect x="260" y="200" width="55" height="20"/><rect x="390" y="140" width="55" height="40"/><rect x="455" y="90" width="55" height="30"/><rect x="520" y="160" width="55" height="20"/><rect x="585" y="200" width="55" height="20"/><rect x="650" y="160" width="55" height="20"/><rect x="715" y="220" width="55" height="40"/>
    </g>
    <g font-size="11" fill="#64748b" text-anchor="middle">
      <text x="27" y="285">0</text><text x="92" y="285">1</text><text x="157" y="285">2</text><text x="222" y="285">3</text><text x="287" y="285">4</text><text x="352" y="285">5</text><text x="417" y="285">6</text><text x="482" y="285">7</text><text x="547" y="285">8</text><text x="612" y="285">9</text><text x="677" y="285">10</text><text x="742" y="285">11</text>
    </g>
    <text x="0" y="320" font-size="13" fill="#0f766e">左指针 leftMax 从左往右维护；右指针 rightMax 从右往左维护；每次移动较小的一侧，水量由较小侧决定。</text>
  </g>
</svg>
