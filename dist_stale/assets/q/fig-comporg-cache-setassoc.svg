<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#5f6368"/></marker></defs>
<text x="340" y="26" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">组相联 Cache（以 4 路组相联为例）</text>
<rect x="60" y="60" width="315.0" height="46" fill="#cfe2ff" stroke="#1a73e8" stroke-width="1.4"/>
<text x="217" y="82" font-size="12" fill="#202124" text-anchor="middle" font-weight="bold">Tag</text>
<text x="217" y="100" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">18 位</text>
<rect x="375" y="60" width="140.0" height="46" fill="#d7f0e0" stroke="#0f9d58" stroke-width="1.4"/>
<text x="445" y="82" font-size="12" fill="#202124" text-anchor="middle" font-weight="bold">组索引 Set</text>
<text x="445" y="100" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">8 位</text>
<rect x="515" y="60" width="70.0" height="46" fill="#fde7c4" stroke="#f4b400" stroke-width="1.4"/>
<text x="550" y="82" font-size="12" fill="#202124" text-anchor="middle" font-weight="bold">Offset</text>
<text x="550" y="100" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">4 位</text>
<text x="340" y="132" font-size="12" fill="#5f6368" text-anchor="middle" font-weight="normal">32 位 = Tag(18) + SetIndex(8) + Offset(4)（示例）</text>
<rect x="60" y="130" width="560" height="120" rx="8" fill="#f1f3f4" stroke="#5f6368"/>
<text x="72" y="154" font-size="12" fill="#1a73e8" text-anchor="start" font-weight="bold">定量关系（Cache 共 64 行）</text>
<text x="72" y="178" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">组数 = 行数 / 路数 = 64 / 4 = 16 组 → SetIndex = log2(16) = 4 位（上图取 8 位表示更通用情形）</text>
<text x="72" y="198" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">全相联：SetIndex=0，整块可放任意行，Tag=28 位，查找最慢但冲突最少</text>
<text x="72" y="218" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">直接映射=1 路组相联；路数↑ → 冲突↓、Tag↑、比较器↑、命中快</text>
<text x="340" y="278" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">一组内有 4 个 Cache 行，主存块按 SetIndex 找到组后，在组内比对 4 个 Tag。</text>
<rect x="230" y="290" width="220" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="340" y="313.1" font-size="13" fill="#202124" text-anchor="middle">组 Set[k]：行0 行1 行2 行3（4路）</text>
</svg>
