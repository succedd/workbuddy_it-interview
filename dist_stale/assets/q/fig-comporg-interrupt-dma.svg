<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#5f6368"/></marker></defs>
<text x="340" y="26" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">中断方式 vs DMA 方式（I/O 传输）</text>
<rect x="60" y="60" width="260" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="190" y="83.0" font-size="13" fill="#202124" text-anchor="middle">中断方式</text>
<rect x="60" y="110" width="260" height="30" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="190" y="126.3" font-size="11" fill="#202124" text-anchor="middle">外设就绪→发中断请求</text>
<rect x="60" y="146" width="260" height="30" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="190" y="162.3" font-size="11" fill="#202124" text-anchor="middle">CPU 保存现场、转入 ISR</text>
<rect x="60" y="182" width="260" height="30" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="190" y="198.3" font-size="11" fill="#202124" text-anchor="middle">ISR 用 IN/OUT 或_load 逐字搬运</text>
<rect x="60" y="218" width="260" height="30" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="190" y="234.3" font-size="11" fill="#202124" text-anchor="middle">每个字都经 CPU 寄存器</text>
<rect x="60" y="254" width="260" height="30" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="190" y="270.4" font-size="11" fill="#202124" text-anchor="middle">传输完→恢复现场、返回</text>
<text x="190" y="300" font-size="11" fill="#db4437" text-anchor="middle" font-weight="bold">CPU 全程参与每个字节</text>
<rect x="360" y="60" width="260" height="40" rx="6" fill="#e6f4ea" stroke="#0f9d58" stroke-width="1.5"/>
<text x="490" y="83.0" font-size="13" fill="#202124" text-anchor="middle">DMA 方式</text>
<rect x="360" y="110" width="260" height="30" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="490" y="126.3" font-size="11" fill="#202124" text-anchor="middle">CPU 设好 源/目的/长度 给 DMAC</text>
<rect x="360" y="146" width="260" height="30" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="490" y="162.3" font-size="11" fill="#202124" text-anchor="middle">DMAC 接管总线、自行搬运整块</text>
<rect x="360" y="182" width="260" height="30" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="490" y="198.3" font-size="11" fill="#202124" text-anchor="middle">传输中 CPU 可执行其他任务</text>
<rect x="360" y="218" width="260" height="30" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="490" y="234.3" font-size="11" fill="#202124" text-anchor="middle">整块传完 DMAC 才发一次中断</text>
<rect x="360" y="254" width="260" height="30" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
<text x="490" y="270.4" font-size="11" fill="#202124" text-anchor="middle">仅开始/结束需 CPU</text>
<text x="490" y="300" font-size="11" fill="#0f9d58" text-anchor="middle" font-weight="bold">CPU 只在两端介入</text>
<line x1="320" y1="160" x2="360" y2="160" stroke="#5f6368" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<text x="340" y="335" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">大数据块（如磁盘读）用 DMA 显著解放 CPU；小量/异步事件用中断更轻量。</text>
</svg>
