<text x="430" y="70" font-size="13" fill="#1a73e8" text-anchor="start" font-weight="bold">定量计算</text>
<text x="430" y="95" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">非流水线：5×4Δt = 20Δt</text>
<text x="430" y="121" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">流水线：首条 4Δt，其后每 Δt 出 1 条</text>
<text x="430" y="147" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">总耗时 = 4 + (5-1) = 8Δt</text>
<text x="430" y="173" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">吞吐率 TP = 5 / 8Δt = 0.625/Δt</text>
<text x="430" y="199" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">加速比 S = 20Δt / 8Δt = 2.5</text>
<text x="430" y="225" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">效率 E = 20 / (4段×8时) = 20/32 = 62.5%</text>
<text x="340" y="250" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">注：无冲突/冒险的理想情况；实际需处理数据/控制/结构冒险（见题 483/1383）。</text>
