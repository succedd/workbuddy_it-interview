<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#5f6368"/></marker></defs>
<text x="340" y="26" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">补码模运算圆环（以 mod 8 为例）</text>
<circle cx="230" cy="200" r="140" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="230" y="65" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">0</text>
<text x="328" y="106" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">1</text>
<text x="370" y="205" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">2</text>
<text x="328" y="303" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">3 (-5)</text>
<text x="230" y="345" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">4 (-4)</text>
<text x="131" y="303" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">5 (-3)</text>
<text x="90" y="205" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">6 (-2)</text>
<text x="131" y="106" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">7 (-1)</text>
<circle cx="131" cy="298" r="14" fill="#fce8e6" stroke="#db4437" stroke-width="2"/>
<circle cx="328" cy="298" r="14" fill="#fce8e6" stroke="#db4437" stroke-width="2"/>
<text x="131" y="303" font-size="12" fill="#db4437" text-anchor="middle" font-weight="bold">5</text>
<text x="328" y="303" font-size="12" fill="#db4437" text-anchor="middle" font-weight="bold">3</text>
<rect x="430" y="90" width="220" height="170" rx="8" fill="#f1f3f4" stroke="#5f6368"/>
<text x="442" y="114" font-size="12" fill="#1a73e8" text-anchor="start" font-weight="bold">为何减法变加法</text>
<text x="442" y="138" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">3 位补码模 2³=8：环上每 8 步回到原点。</text>
<text x="442" y="158" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">−3 mod 8 = 5，所以 A−3 ≡ A+5 (mod 8)。</text>
<text x="442" y="178" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">加/减法器只做加法：</text>
<text x="442" y="198" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">  A − B = A + (−B) = A + (2ⁿ − B补)</text>
<text x="442" y="218" font-size="12" fill="#202124" text-anchor="start" font-weight="normal">符号位自然参与运算，无额外判断。</text>
</svg>
