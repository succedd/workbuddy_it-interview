<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <rect width="680" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arw-ka1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arw-ka2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="arw-ka3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="16" y="30" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#2563eb">TCP Keepalive 探测机制与「半打开连接」的产生与清理</text>

  <!-- 左栏:keepalive 三参数时序 -->
  <rect x="10" y="46" width="320" height="424" rx="8" fill="#eff6ff" stroke="#9ca3af" stroke-width="1"/>
  <text x="170" y="70" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Keepalive 三参数时序</text>

  <rect x="40" y="86" width="90" height="28" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="85" y="105" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2937">本端</text>
  <rect x="230" y="86" width="90" height="28" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="275" y="105" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2937">对端</text>
  <line x1="85" y1="120" x2="85" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="275" y1="120" x2="275" y2="300" stroke="#9ca3af" stroke-width="1.5"/>

  <rect x="100" y="126" width="160" height="26" rx="6" fill="#fefce8"/>
  <text x="180" y="144" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#b45309">空闲 idle(默认 7200s)</text>

  <line x1="85" y1="168" x2="275" y2="168" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arw-ka1)"/>
  <text x="180" y="162" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">探测包 1</text>
  <line x1="275" y1="186" x2="85" y2="186" stroke="#059669" stroke-width="1.5" marker-end="url(#arw-ka2)"/>
  <text x="180" y="180" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#059669">回 ACK,计时器重置</text>

  <rect x="100" y="200" width="160" height="26" rx="6" fill="#fef2f2"/>
  <text x="180" y="218" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#dc2626">无响应,每 75s 探测一次</text>

  <line x1="85" y1="242" x2="275" y2="242" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw-ka3)"/>
  <text x="180" y="236" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#dc2626">探测 2…9(共 probes 次)</text>
  <line x1="85" y1="264" x2="85" y2="290" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arw-ka3)"/>
  <text x="100" y="282" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#dc2626">判死,发 RST 释放资源</text>

  <rect x="26" y="316" width="288" height="118" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="170" y="338" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Linux 参数(sysctl)</text>
  <text x="40" y="360" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">tcp_keepalive_time = 7200(空闲多久开始探测)</text>
  <text x="40" y="380" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">tcp_keepalive_intvl = 75(两次探测间隔)</text>
  <text x="40" y="400" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">tcp_keepalive_probes = 9(最多探测次数)</text>
  <text x="40" y="424" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#dc2626">默认判死最长 7200+75×9 = 7875s,约 2 小时 11 分</text>

  <text x="170" y="456" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">默认关闭,需 SO_KEEPALIVE 显式开启</text>

  <!-- 右栏:半打开连接 -->
  <rect x="350" y="46" width="320" height="424" rx="8" fill="#fef2f2" stroke="#9ca3af" stroke-width="1"/>
  <text x="510" y="70" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#dc2626">半打开连接(Half-Open)</text>

  <rect x="370" y="86" width="280" height="60" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="510" y="106" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#dc2626">如何产生</text>
  <text x="510" y="126" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">客户端断电、网线拔掉、进程崩溃,</text>
  <text x="510" y="140" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#dc2626">服务端毫不知情,连接单方面「活着」</text>

  <rect x="370" y="158" width="280" height="60" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="510" y="178" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#dc2626">危害</text>
  <text x="510" y="198" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">白白占用内存中的 TCB 资源与端口;</text>
  <text x="510" y="212" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#dc2626">堆积多了耗尽连接资源,新连接被拒</text>

  <rect x="370" y="230" width="280" height="86" rx="6" fill="#f0fdf4" stroke="#059669"/>
  <text x="510" y="250" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#059669">如何清理:两条路</text>
  <text x="384" y="270" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">① 对端已重启:收到数据/探测后,</text>
  <text x="384" y="286" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">因无此连接上下文,回 RST 立即关闭</text>
  <text x="384" y="306" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">② 对端不可达:keepalive 探测</text>
  <text x="384" y="322" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">probes 次无响应后,内核判死并释放</text>

  <rect x="370" y="328" width="280" height="106" rx="6" fill="#fefce8"/>
  <text x="510" y="348" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#b45309">RST 的其他典型场景</text>
  <text x="384" y="368" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">· 访问未监听的端口(连接直接拒绝)</text>
  <text x="384" y="386" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">· 异常终止连接(close 前残留数据)</text>
  <text x="384" y="404" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#1f2937">· 全连接队列溢出且 tcp_abort_on_overflow=1</text>
  <text x="384" y="422" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">应用层心跳(WebSocket Ping/Pong、gRPC</text>
  <text x="384" y="438" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">keepalive)可更快发现故障并感知应用健康</text>
</svg>
