  <!-- Third-party libraries（本地 vendor，随 Service Worker 离线缓存；
       echarts / xlsx 大库不再首屏加载，按需加载见 utils.js 的 loadScript） -->
    <!-- ⚠️ 脚本加载器（内联，本身不产生请求 —— 这是关键）
       ============================================================
       为什么不用 <script defer src>：实测 Cloudflare 到中国大陆的链路上
       **约有一半请求会卡死到超时**（同一文件连续 6 次测试，3 次 0 B/s 完全超时，
       成功的 3 次速度相差 6 倍：16 / 17 / 97 KB/s）。
       而浏览器对 <script> 的网络超时极其漫长（数分钟），页面就一直白着 ——
       更糟的是**卡住的 defer 脚本会连 DOMContentLoaded 和 load 都不触发**，
       所以「等 load 再补救」这条路根本不成立。

       改成：内联脚本（不会遭遇网络问题）动态加载这 27 个文件，
       每个都带 8 秒超时 + 最多 2 次重试。
         · el.async = false 保证「按插入顺序执行」（依赖顺序不变），
           同时仍然并行下载 —— 不牺牲速度。
         · 超时后把元素移除，再重新拉一次；重复执行由各脚本的幂等防护挡住。
         · 某个文件最终仍失败也不阻断其余文件与整页初始化。
       ============================================================ -->
  <script>
  /* 版本号必须在这里自己定义一份：原本它写在下面的 SW 注册脚本里，
     而那个脚本执行得更晚，加载器等不到；何况它还被包在 `if ("serviceWorker" in navigator)`
     里面 —— 浏览器不支持 SW 时根本不会定义。bump-version.py 会连带这里一起替换。 */
  window.PAGE_VER = window.PAGE_VER || "20261009a";
  (function () {
    var V = window.PAGE_VER || "";
    /* 27 个源文件已合并为 4 个 bundle（tools/bundle-js.py 生成）。
       前 3 个走关键路径；extra 那一组全是路由/交互才用到的，等关键路径出齐再拉。 */
    var CRITICAL = [
      "js/bundle/bundle-vendor.js",
      "js/bundle/bundle-core.js",
      "js/bundle/bundle-app.js"
    ];
    var DEFERRED = ["js/bundle/bundle-extra.js"];
    var TIMEOUT = 8000, TRIES = 4;
    function loadOne(src) {
      var url = src + "?v=" + V;
      return new Promise(function (resolve) {
        var n = 0;
        function attempt() {
          var settled = false;
          var el = document.createElement("script");
          el.async = false;                 /* 保持执行顺序，但仍并行下载 */
          var timer = setTimeout(function () {
            if (settled) return; settled = true;
            try { el.onload = el.onerror = null; el.remove(); } catch (e) {}
            retry();
          }, TIMEOUT);
          function retry() {
            n++;
            if (n <= TRIES) setTimeout(attempt, 300 * n);
            else resolve(false);            /* 放弃这一个，但不影响其它脚本 */
          }
          el.onload = function () { if (settled) return; settled = true; clearTimeout(timer); resolve(true); };
          el.onerror = function () { if (settled) return; settled = true; clearTimeout(timer); retry(); };
          /* 加 r= 参数绕开可能已经坏掉的缓存条目（首次请求不加，保持 URL 干净） */
          el.src = n ? (url + "&r=" + n) : url;
          document.head.appendChild(el);
        }
        attempt();
      });
    }
    /* ⚠️ 必须并行「发起」：写成 `chain = chain.then(loadOne)` 那种串行等待，
       就等于等上一个下载完才发下一个 —— 27 个文件 × 每次往返，首屏会被拖成几十秒。
       这里一次性把 27 个请求都发出去（并行下载），
       靠 el.async = false 保证它们**按插入顺序执行**，依赖顺序不受影响。 */
    var all = CRITICAL.map(function (s) { return loadOne(s); });
    Promise.all(all).then(function (results) {
      try {
        var failed = [];
        for (var i = 0; i < results.length; i++) if (!results[i]) failed.push(CRITICAL[i]);
        if (failed.length) console.warn("[boot] 关键脚本重试后仍未加载成功:", failed.join(", "));
        performance.mark("boot:scripts-loaded");
      } catch (e) {}
      /* 关键路径出齐（或已放弃）之后再拉非首屏那一组。
         刻意放在这里而不是与之并行：慢窗口下带宽有限，
         让它抢在前面只会拖慢首屏真正需要的那 3 个。 */
      DEFERRED.forEach(function (s) { loadOne(s); });
    });
  })();
  </script>
  <!-- PWA：离线可用（注册 Service Worker，失败静默不影响正常使用） -->
  <!-- 新版本提示：检测到新 SW 后显示胶囊，用户点击才刷新（不打断阅读/答题） -->
  <style>
    #sw-update-pill{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#111827;color:#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.28);font-family:inherit;border:none;line-height:1}
    #sw-update-pill:hover{transform:translateY(-1px)}
    #sw-update-pill:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
    #sw-update-pill .sw-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25);flex:none}
    @media (max-width:640px){#sw-update-pill{right:12px;bottom:12px;font-size:12px;padding:9px 14px}}
  </style>
  <script>
    if ("serviceWorker" in navigator) {
      window.PAGE_VER = "20261009a";   // 本页构建版本：报错文案带上它，远程诊断一眼定位旧标签页
      window.addEventListener("load", function () {
        var SWV = "20261009a";
        function showUpdatePill(onClick) {
          if (document.getElementById("sw-update-pill")) return;
          var pill = document.createElement("button");
          pill.id = "sw-update-pill";
          pill.type = "button";
          pill.setAttribute("aria-label", "发现新版本，点击刷新页面");
          pill.innerHTML = '<span class="sw-dot"></span><span>有新版本，点击刷新</span>';
          pill.addEventListener("click", onClick);
          document.body.appendChild(pill);
        }
        navigator.serviceWorker.register("sw.js?v=" + SWV).then(function (reg) {
          if (!reg) return;
          function watch(worker) {
            /* 仅在「已有旧控制器」时提示：首次安装不打扰 */
            if (worker && worker.state === "installed" && navigator.serviceWorker.controller) {
              showUpdatePill(function () {
                try { worker.postMessage({ type: "SKIP_WAITING" }); } catch (_) {}
                try { window.location.reload(); } catch (_) { window.location.href = window.location.href; }
              });
            }
          }
          if (reg.installing) watch(reg.installing);
          reg.addEventListener("updatefound", function () {
            var w = reg.installing;
            if (!w) return;
            w.addEventListener("statechange", function () { watch(w); });
          });
          /* SPA 哈希路由不触发导航，浏览器不会自动复查 sw.js —— 每小时主动查一次 */
          setInterval(function () { try { reg.update(); } catch (_) {} }, 3600000);
        }).catch(function () {});
        /* 旧标签页自愈（20260913h）：SPA 哈希路由永不整页刷新，页面 JS 会困在当天早上的
           旧版（典型症状：明明已发新版修复，用户开着旧标签页反复报同样的错）。
           每 5 分钟拉一次 sw.js（绕 HTTP 缓存）比对 VERSION，发现不一致立即弹更新胶囊——
           比仅靠每小时 reg.update() 快 12 倍，且不依赖 SW 安装事件。 */
        setInterval(function () {
          try {
            fetch("sw.js", { cache: "reload" }).then(function (r) { return r.text(); }).then(function (t) {
              var m = t.match(/VERSION\s*=\s*"([^"]+)"/);
              if (m && m[1] && m[1] !== window.PAGE_VER) {
                showUpdatePill(function () { window.location.reload(); });
              }
            }).catch(function () {});
          } catch (_) {}
        }, 300000);
      });
    }
  </script>
