    <h1>二叉树的遍历方式有哪些？</h1>
    <div class="chips"><span class="chip diff">中级</span><span class="chip">简答题</span><span class="chip tag">数据结构</span><span class="chip tag">二叉树</span><span class="chip tag">遍历</span></div>
    <div class="card"><h2>题目</h2><p>请解释前序、中序、后序、层序遍历。</p></div>
    <div class="card"><h2>参考答案</h2><h3>二叉树遍历</h3>
<p><strong>前序(根左右)</strong>: 先访问根，再左子树，最后右子树</p>
<p><strong>中序(左根右)</strong>: 先左子树，再根，最后右子树(BST排序输出)</p>
<p><strong>后序(左右根)</strong>: 先左子树，再右子树，最后根</p>
<p><strong>层序(BFS)</strong>: 从上到下从左到右逐层遍历</p>
<p><strong>非递归</strong>: 使用栈模拟递归</p></div>
