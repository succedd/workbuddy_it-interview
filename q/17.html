  <meta name="description" content="闭包 是函数与其词法作用域的组合，使内部函数可以访问外部函数作用域的变量，即使外部函数已返回。 应用：数据私有化、函数工厂、节流防抖、React hooks 原理、模块化（IIFE）。 陷阱：闭包长期持有外部变量引用，可能导致内存泄漏；循环中用 var 创建闭包常拿到同一变量，需用 let 或 IIFE 解决。">
