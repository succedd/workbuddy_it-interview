  <title>进程与线程的区别是什么？上下文切换的开销来自哪里？ · IT面试题库</title>
  <meta name="description" content="区别： 进程是资源分配的基本单位，拥有独立的地址空间、文件句柄等；线程是CPU 调度的基本单位，同一进程内的线程共享地址空间与资源。 线程更轻量：创建/销毁/切换成本低于进程；进程间通信（IPC）需管道/共享内存等，线程间可直接读写共享变量（需加锁）。 上下文切换开销：切换时要保存/恢复寄存器、程序计数器、栈指针…">
