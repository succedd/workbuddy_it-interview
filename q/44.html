  <meta name="description" content="经典顺序争议： 先更新 DB 再删缓存（Cache-Aside 推荐）：并发下偶发不一致（读在更新前命中旧缓存），但概率低，且靠“删缓存”兜底。 先删缓存再更新 DB：更新期间读会回源旧值并写入缓存，造成长期不一致。 增强方案： 延迟双删：更新 DB 后删缓存，延迟几百 ms 再删一次，清除回源写入的旧值。 订阅…">
