# ============================================================
# it-interview · 推 release 自动部署到 Cloudflare Pages
# ============================================================
# 为什么用 GitHub Actions 而不是 Cloudflare 的 Git 集成：
#   现有 Pages 项目 it-interview 是「直传(Direct Upload)」项目，无法再转成
#   Git 连接（API 报 8000069）；改用 Git 连接必须新建项目 → 子域不再是
#   it-interview-889.pages.dev → 已提交的 is-a.dev CNAME 变更 PR #53221
#   会作废、要重开重排队。所以走 Actions，部署到【同一个】现有项目。
#
# 它做三件事：白名单组装 dist/ → 跑反爬守卫回归 → wrangler 直传上线。
#
# ---------- 为什么这个文件放在 tools/ci/ 而不是 .github/workflows/ ----------
# 本机用于自动化的 GitHub token 只有 gist / read:org / repo 三个 scope，
# 缺 workflow scope，无法通过 API 或 git push 写 .github/workflows/* 下的文件
# （GitHub 用 404 伪装拒绝）。所以先放在这里，由人工在 GitHub 网页端把它
# **移动到 .github/workflows/deploy-pages.yml**（网页编辑器里改文件名即可，
# 不需要复制粘贴内容），移过去后 Actions 才会开始运行。
#
# ---------- 启用前需要两步（都在浏览器里，约 5 分钟） ----------
# ① 建一枚 Cloudflare API Token（只给这个项目用，最小权限）
#    Cloudflare Dashboard → 右上头像 → My Profile → API Tokens → Create Token
#    → Custom token，权限：Account → Cloudflare Pages → Edit
#    账号资源：Include → 你的账号（Account ID 6e7bbb8c6002ed51eabf4fd5c1f3e066）
# ② 把它存进仓库 Secret，名字必须是 CLOUDFLARE_API_TOKEN
#    https://github.com/succedd/workbuddy_it-interview/settings/secrets/actions
#    → New repository secret → Name: CLOUDFLARE_API_TOKEN → 粘贴 → Add secret
#
# 之后：任何 push 到 release 分支（含站点编辑端自动推的「备份/发布题库」
# 提交）都会自动构建并上线，不再依赖本机开机、也不用等定时兜底部署。
# ============================================================

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 白名单组装 dist/：只把站点必需文件拷进去，tools/、cloudflare/、
      # HANDOVER.md 等内部文件根本不进产物（比上传后再 404 更安全）
      - name: Build dist (whitelist)
        run: node tools/build-pages.mjs

      # 反爬守卫回归：任何一条不过就中止，绝不把坏版本推上线
      - name: Anti-scrape guard regression
        run: node tools/pages-guard-test.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6e7bbb8c6002ed51eabf4fd5c1f3e066
        # 必须带 --branch release，否则会落成 preview 部署、生产别名不更新
        run: npx --yes wrangler@3 pages deploy dist --project-name it-interview --branch release
